heard:
  fields:
    satellite:
      example: assist_satellite.living_room
      selector:
        entity:
          domain: assist_satellite
    waiting:
      default: false
      selector:
        boolean:
    seconds:
      example: 9
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s
journal:
  fields:
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 200
notifications:
  fields:
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 200
trip_map:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: device_tracker
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    name:
      default: trajet
      selector:
        text:
news:
  fields:
    url:
      required: true
      selector:
        text:
          type: url
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 50
listen:
  fields:
    satellite:
      example: assist_satellite.living_room
      selector:
        entity:
          domain: assist_satellite
    message:
      example: Je vous écoute
      selector:
        text:
screen:
  fields:
    action:
      required: true
      selector:
        select:
          options: [pc, dashboard, "off", "on", toggle, app, close]
    app:
      selector:
        select:
          options: [sound, equalizer, bluetooth]
disarm:
  fields:
    code:
      required: true
      selector:
        text:
          type: password
unlock_screen:
  fields:
    code:
      required: true
      selector:
        text:
          type: password
    entity_id:
      required: true
      selector:
        entity:
          domain: input_boolean
dns_log:
  fields:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 500
    blocked_only:
      default: false
      selector:
        boolean:
    search:
      selector:
        text:
dns_map:
  fields:
    minutes:
      default: 15
      selector:
        number:
          min: 1
          max: 120
wifi_clients: {}
net_map: {}
wifi_scan: {}
traffic:
  fields:
    latitude:
      required: true
      selector:
        number:
          min: -85
          max: 85
          step: any
    longitude:
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: any
    radius_km:
      default: 10
      selector:
        number:
          min: 1
          max: 50
