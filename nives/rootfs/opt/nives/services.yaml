heard:
  fields:
    satellite:
      example: assist_satellite.living_room
      selector:
        entity:
          domain: assist_satellite
    waiting:
      default: false
      selector:
        boolean:
    seconds:
      example: 9
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s
journal:
  fields:
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 200
news:
  fields:
    url:
      required: true
      selector:
        text:
          type: url
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 50
screen:
  fields:
    action:
      required: true
      selector:
        select:
          options: [pc, dashboard, "off", "on", toggle, app, close]
    app:
      selector:
        select:
          options: [sound, equalizer, bluetooth]
