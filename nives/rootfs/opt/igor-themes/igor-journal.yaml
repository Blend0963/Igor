# Igor Journal: Home Assistant in the style of Igor's wall-tablet journal.
# Installed by the Igor add-on into /config/themes/ (it replaces this file on
# each update: copy it under another name to change it). Needs, once, in
# configuration.yaml:
#   frontend:
#     themes: !include_dir_merge_named themes
# Then Profile → Theme → "Igor Journal" (Auto follows the device's light or
# dark setting). On the wall tablet, "Igor Journal (tablette)": the same,
# without Home Assistant's top bar (Igor's wall cards hide it; it comes back
# while editing the dashboard, or with ?barre in the address).
Igor Journal: &igor_journal
  # A monospace face everywhere: the device's own (Menlo, Roboto Mono, DejaVu
  # Sans Mono…), nothing is downloaded.
  primary-font-family: &mono "ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, 'Roboto Mono', 'DejaVu Sans Mono', monospace"
  paper-font-common-base_-_font-family: *mono
  paper-font-common-code_-_font-family: *mono
  mdc-typography-font-family: *mono
  ha-font-family-body: *mono
  ha-font-family-heading: *mono
  ha-font-family-code: *mono
  # Thin lines, small corners, no shadows.
  ha-card-border-radius: "6px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "none"
  ha-dialog-border-radius: "8px"
  ha-badge-border-radius: "6px"
  mdc-shape-small: "4px"
  mdc-shape-medium: "6px"
  # Mushroom cards more compact: a whole screen of them fits without scrolling.
  mush-spacing: "8px"
  mush-icon-size: "30px"
  mush-control-height: "32px"
  mush-card-primary-font-size: "13px"
  mush-card-secondary-font-size: "11px"
  mush-card-primary-line-height: "17px"
  mush-card-secondary-line-height: "15px"
  mush-chip-height: "30px"
  modes:
    dark:
