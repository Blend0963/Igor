# Igor Journal: Home Assistant in the style of Igor's wall-tablet journal.
# Installed by the Igor add-on into /config/themes/ (it replaces this file on
# each update: copy it under another name to change it). Needs, once, in
# configuration.yaml:
#   frontend:
#     themes: !include_dir_merge_named themes
# Then Profile → Theme → "Igor Journal" (Auto follows the device's light or
# dark setting).
Igor Journal:
  # A monospace face everywhere: the device's own (Menlo, Roboto Mono, DejaVu
  # Sans Mono…), nothing is downloaded.
  primary-font-family: &mono "ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, 'Roboto Mono', 'DejaVu Sans Mono', monospace"
  paper-font-common-base_-_font-family: *mono
  paper-font-common-code_-_font-family: *mono
  mdc-typography-font-family: *mono
  ha-font-family-body: *mono
  ha-font-family-heading: *mono
  ha-font-family-code: *mono
  # Thin lines, small corners, no shadows.
  ha-card-border-radius: "6px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "none"
  ha-dialog-border-radius: "8px"
  ha-badge-border-radius: "6px"
  mdc-shape-small: "4px"
  mdc-shape-medium: "6px"
  modes:
    dark:
      primary-color: "#6cc4f5"
      accent-color: "#5cc28f"
      dark-primary-color: "#2f8fc4"
      light-primary-color: "#10202c"
      text-primary-color: "#0d1014"
      primary-text-color: "#d5dbe1"
      secondary-text-color: "#6b7682"
      disabled-text-color: "#3d464f"
      divider-color: "#1d242c"
      outline-color: "#1f262e"
      primary-background-color: "#0d1014"
      secondary-background-color: "#11151a"
      card-background-color: "#12171c"
      ha-card-background: "#12171c"
      ha-card-border-color: "#1f262e"
      clear-background-color: "#0d1014"
      app-header-background-color: "#0d1014"
      app-header-text-color: "#d5dbe1"
      app-header-border-bottom: "1px solid #1d242c"
      sidebar-background-color: "#0a0d10"
      sidebar-text-color: "#8b96a3"
      sidebar-icon-color: "#6b7682"
      sidebar-selected-text-color: "#6cc4f5"
      sidebar-selected-icon-color: "#6cc4f5"
      sidebar-menu-button-text-color: "#d5dbe1"
      state-icon-color: "#6b7682"
      state-active-color: "#5cc28f"
      state-icon-active-color: "#5cc28f"
