name: "MaDo"
version: "0.1.4"
slug: "mado"
description: "MaDo — assistant IA pour Home Assistant avec mémoire persistante"
url: "https://github.com/Blend0963/MaDo"
image: ghcr.io/blend0963/mado-{arch}
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant: "2024.4.0"
homeassistant_api: true
hassio_api: true
auth_api: true
discovery:
  - nives
map:
  - addon_config:rw
  - config:rw
ports:
  3100/tcp: null
memory: 768
panel_icon: "mdi:brain"
options:
  byok:
    provider: "anthropic"
    api_key: ""
    model: ""
    base_url: ""
  mistral_api_key: ""
  custom_prompt: ""
  log_level: "info"
schema:
  byok:
    provider: "list(anthropic|openai|openrouter|mistral|ollama)?"
    api_key: "password?"
    model: "str?"
    base_url: "str?"
  mistral_api_key: "password?"
  custom_prompt: "str?"
  # Ceiling on one written reply. Left unset, MaDo picks its own. Deliberately
  # absent from `options:` above so that "unset" stays a real state rather than
  # a magic number, and so the built-in default can be improved without every
  # existing install being pinned to whatever today's value happens to be.
  max_output_tokens: "int(256,32768)?"
  # How much the model thinks before answering. Absent from `options:` for the
  # same reason: unset sends nothing and leaves the model on its own default.
  reasoning_effort: "list(none|minimal|low|medium|high)?"
  # All three absent from `options:` for the same reason as max_output_tokens:
  # unset means "MaDo decides", which today is the list of entities exposed to
  # Assist, for the room map and for what the assistant can reach.
  layout_from_exposed: "bool?"
  tools_from_exposed: "bool?"
  layout_domains: "str?"
  log_level: "list(debug|info|warn|error)"
