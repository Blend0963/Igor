name: "Igor"
version: "0.11.10"
slug: "mado"
description: "In Igor we trust. L'assistant IA de la maison, avec sa mémoire"
url: "https://github.com/Blend0963/MaDo"
image: ghcr.io/blend0963/mado-{arch}
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant: "2024.4.0"
homeassistant_api: true
hassio_api: true
discovery:
  - nives
map:
  - addon_config:rw
  - config:rw
ports:
  3100/tcp: null
ports_description:
  3100/tcp: Igor app (PWA), only behind your own HTTPS reverse proxy
memory: 768
panel_icon: "mdi:bow-tie"

# Thread panel served by the bundled server. Ingress puts it behind the
# Home Assistant login and into the sidebar (panel_title above the icon);
# the raw 3100 port stays unexposed by default.
ingress: true
ingress_port: 3100
panel_title: "Igor"
options:
  byok:
    provider: "anthropic"
    api_key: ""
    model: ""
    base_url: ""
  mistral_api_key: ""
  custom_prompt: ""
  log_level: "info"
schema:
  byok:
    provider: "list(anthropic|openai|openrouter|mistral|ollama)?"
    api_key: "password?"
    model: "str?"
    base_url: "str?"
  mistral_api_key: "password?"
  custom_prompt: "str?"
  # Appended to custom_prompt for one kind of conversation only: spoken
  # Assist, or a thread in the chat panel. Absent from `options:` above so an
  # existing install keeps exactly the persona it had.
  custom_prompt_voice: "str?"
  custom_prompt_thread: "str?"
  # Assist request style. Unset = auto: the integration flags only satellites
  # as spoken, so voice from the phone app arrives as typed text; "voice"
  # treats every Assist request as spoken. Panel threads are never affected.
  assist_mode: "list(auto|voice|text)?"
  # Long-term facts in chat threads. Unset = shared with Assist and the
  # other threads; "isolated" gives each thread its own. History is per
  # thread either way.
  thread_memory: "list(shared|isolated)?"
  # Speech-to-text for the chat panel's microphone (Voxtral on Mistral's
  # API). Unset = on whenever a Mistral key is available (the web-search key,
  # or the chat key when the provider is Mistral); "off" disables it.
  speech_to_text: "list(auto|off)?"
  # Ceiling on one written reply. Left unset, Igor picks its own. Deliberately
  # absent from `options:` above so that "unset" stays a real state rather than
  # a magic number, and so the built-in default can be improved without every
  # existing install being pinned to whatever today's value happens to be.
  max_output_tokens: "int(256,32768)?"
  # How much the model thinks before answering. Absent from `options:` for the
  # same reason: unset sends nothing and leaves the model on its own default.
  reasoning_effort: "list(none|minimal|low|medium|high)?"
  # Reasoning in chat threads. Unset = high.
  thread_reasoning: "list(none|low|medium|high)?"
  # Voxtral TTS (🔊 in the panel, TTS engine in HA). Unset = off.
  text_to_speech: "list(off|mistral)?"
  tts_voice: "str?"
  # Mistral document libraries (search_documents) and MCP connectors
  # (use_connector), comma-separated. Unset = tool not offered.
  mistral_library_ids: "str?"
  mistral_connectors: "str?"
  # Price shown before a scanned PDF goes to Mistral OCR. Unset = 4 (USD).
  ocr_price_per_1000_pages: "float(0,1000)?"
  # Cheaper model for plain commands ("allume le salon") and quick state
  # questions. Unset = every request on the main model.
  fast_model: "str?"
  # Reminders, scheduled tasks and the morning briefing are sent to this
  # notify service (e.g. mobile_app_pixel_8). Unset = a persistent
  # notification in Home Assistant.
  notify_service: "str?"
  # Morning briefing time (HH:MM, house time). Unset = no briefing.
  daily_briefing_time: "match(^\\d{1,2}:\\d{2}$)?"
  daily_briefing_prompt: "str?"
  # Prices for the cost counter, JSON {"model-prefix": [input, output]} in
  # USD per million tokens, added to the built-in list.
  model_prices: "str?"
  # House watch: off (unset), on (entities exposed to Assist) or all (the
  # whole house). Plain checks every 5 minutes; the cheap model only judges
  # what they flag. Quiet hours hold back all but safety alarms.
  house_watch: "list(off|on|all)?"
  # How far Igor may change the configuration: off (read only), automations
  # (default) or yaml (also scripts.yaml, configuration.yaml, packages…).
  config_edits: "list(off|automations|yaml)?"
  # Set to true once to regenerate the API token (switched back off by itself).
  rotate_api_token: "bool?"
  watch_quiet_hours: "match(^\\d{1,2}:\\d{2}-\\d{1,2}:\\d{2}$)?"
  watch_max_per_day: "int(1,50)?"
  # Daily "anything useful to say?" check (HH:MM). Unset = never.
  watch_lively_time: "match(^\\d{1,2}:\\d{2}$)?"
  # Cheaper model for the background memory-extraction pass. Unset = the
  # main chat model. Absent from `options:` above, like the rest: an
  # empty value means "same model as the chat model".
  extraction_model: "str?"
  # Skip the extraction pass when the user's message provably taught
  # nothing (pure commands, pure questions, bare acknowledgements). On
  # by default; "off" restores the always-extract behaviour.
  extraction_gate: "list(on|off)?"
  # Remembered facts sent with each request, in tokens. Unset = 1500.
  memory_token_limit: "int(200,8000)?"
  # All three absent from `options:` for the same reason as max_output_tokens:
  # unset means "Igor decides", which today is the list of entities exposed to
  # Assist, for the room map and for what the assistant can reach.
  layout_from_exposed: "bool?"
  tools_from_exposed: "bool?"
  layout_domains: "str?"
  log_level: "list(debug|info|warn|error)"
