configuration:
  byok:
    name: "Bring Your Own Key (BYOK)"
    description: >-
      Settings for using your own API key. Your model must support function/tool
      calling, which is how Igor controls your home. Going deep on local or
      custom models? Only used when LLM Mode is "byok".
    fields:
      provider:
        name: Provider
        description: >-
          Which LLM provider to use. OpenRouter gives access to many models with
          a single key; Mistral connects to Mistral's own chat API.
      api_key:
        name: API Key
        description: >-
          Your API key for the selected provider.
      model:
        name: Model
        description: >-
          Model ID to use. Examples: anthropic/claude-haiku-4.5 (OpenRouter),
          claude-haiku-4-5-20251001 (Anthropic), gpt-4o-mini (OpenAI),
          mistral-small-latest (Mistral). Leave empty for provider default.
      base_url:
        name: API Base URL
        description: >-
          Custom API endpoint. Required for Ollama (e.g. http://homeassistant:11434/v1).
          Leave empty for cloud providers.
  mistral_api_key:
    name: Mistral API Key (Platform Tools)
    description: >-
      Optional Mistral API key for Mistral's own tools: web search, code
      interpreter, image generation, document libraries, connectors, PDF reading
      (OCR) and Voxtral speech. When your chat provider is Mistral, its key is
      used if this one is empty.
  custom_prompt:
    name: Custom Prompt
    description: >-
      Give the assistant its personality — whatever you write here replaces the
      default Igor persona outright, so one sentence describing who it is does
      the job (e.g. "You are HAL 9000, the calm and precise computer from 2001").
      Applies once the add-on restarts. Leave empty for the default Igor persona.
      This text applies everywhere; the two fields below add to it for one kind
      of conversation only, so shared rules are written once.
  custom_prompt_voice:
    name: Custom Prompt — Voice
    description: >-
      Added after the Custom Prompt for spoken Assist only (satellites, and
      voice on the phone when Assist Mode is "voice"). The place for speaking
      rules: short answers, no formatting, how to say numbers. Leave empty to
      use the Custom Prompt alone.
  custom_prompt_thread:
    name: Custom Prompt — Chat Threads
    description: >-
      Added after the Custom Prompt for threads in the Igor chat panel only,
      where replies are read on screen: Markdown, code blocks with a copy
      button and longer answers are welcome there. Leave empty to use the
      Custom Prompt alone.
  assist_mode:
    name: Assist Mode
    description: >-
      How Igor treats Assist requests. "auto" (default) treats only voice
      satellites as spoken, because Home Assistant does not say when you used
      your voice in the phone app. "voice" treats every Assist request as
      spoken, the right choice when you talk to Assist rather than type.
      "text" treats every Assist request as typed. Chat-panel threads are
      never affected.
  memory_token_limit:
    name: Memory Budget (tokens)
    description: >-
      How much of what Igor remembers about you is sent with each request,
      most relevant first. Every request pays for it, so lower is cheaper.
      Leave empty for 1500, which holds a few dozen facts.
  thread_memory:
    name: Thread memory
    description: >-
      What chat threads know about you. "off" (default): no memories, each
      thread only has its own conversation, and memory belongs to the voice
      alone. "shared": one memory for Assist and every thread. "isolated":
      each thread has a memory of its own. Either way a thread's conversation
      stays its own.
  speech_to_text:
    name: Speech-to-Text (Panel Microphone)
    description: >-
      Transcription for the 🎤 button in the chat panel, done by Mistral's
      Voxtral. "auto" (default) turns it on whenever a Mistral key is set:
      the web-search key above, or your chat key when the provider is
      Mistral. "off" hides the microphone. When on, Igor also offers itself
      as a speech-to-text engine in Home Assistant's voice assistants.
  thread_reasoning:
    name: Thinking in Chat Threads
    description: >-
      How much the model thinks before answering in the chat panel's threads.
      Unset = "high": answers take a few more seconds and are better reasoned
      (Mistral Large 4's reasoning mode). "none" answers straight away. Spoken
      Assist never thinks first.
  text_to_speech:
    name: Text-to-Speech (Voxtral)
    description: >-
      "mistral" gives Igor a voice through Mistral's Voxtral TTS (needs a
      Mistral key): a 🔊 button under each reply in the chat panel, and Igor
      offered as a text-to-speech engine in Home Assistant's voice assistants.
      Unset or "off": no voice.
  tts_voice:
    name: Voxtral Voice
    description: >-
      Voice id for Voxtral TTS, as listed in Mistral's console. Leave empty for
      the default voice.
  mistral_library_ids:
    name: Mistral Document Libraries
    description: >-
      Comma-separated ids of Mistral document libraries (Le Chat → Libraries)
      Igor may search: device manuals, invoices, contracts. Enables the
      search_documents tool, in Assist and in threads.
  mistral_connectors:
    name: Mistral Connectors (experimental)
    description: >-
      Comma-separated names or ids of connectors set up in your Mistral
      account (Gmail, calendar, Notion…). Enables the use_connector tool in
      chat threads. Igor asks before anything that sends, books or deletes.
  ocr_price_per_1000_pages:
    name: OCR Price (per 1000 pages)
    description: >-
      Used only for the estimate Igor shows before reading a scanned PDF with
      Mistral OCR, in USD per 1000 pages. Unset = 4 (Mistral's list price for
      its latest OCR model in October 2026). PDFs that contain text are read on
      the add-on for free and never need OCR.
  local_llm_url:
    name: Local Model (address)
    description: >-
      The address of the model running at home, on the audio VM (installed by
      ear/tools/llm/install.sh), e.g. http://192.168.1.20:8180/v1. When set,
      Assist and the voice answer with it, and nothing you say is sent to the
      online model. If it does not answer, Igor says so, without going to the
      cloud. Chat threads stay on the main model. Empty = Assist on the main
      model.
  local_llm_key:
    name: Local Model (key)
    description: >-
      The local model's key, in ~/.config/igor-llm/api-key on the VM.
  local_llm_prompt:
    name: Local Model (rules)
    description: >-
      Working rules for the local model only: phone scripts, contacts, calls,
      texts, timers. No personality: the online model plays Igor and words the
      replies, with custom_prompt.
  local_order_reply:
    name: Local Model (order reply)
    description: >-
      When the local model carried out an order and has nothing to say
      ("-"). silent: nothing, the order is just carried out (default).
      sentence: a short sentence at once ("Lumière salon allumée."), with no
      online call. online: the online model announces it anyway. When the
      local model asks to speak (a reading, a confirmation asked for, a
      search, a question), or an order fails, the online model always
      answers.
  local_llm_tuned:
    name: Local Model trained on the house
    description: >-
      Turn on only with a local model fine-tuned on your house (training set
      downloadable from the panel's Diagnostic page). It knows the rooms and
      lights, so its prompt leaves out the room map and the light cheat
      sheet: shorter and faster. Leave off with an ordinary model. For it to
      drive every entity, not only those exposed to Assist, also turn off
      tools_from_exposed.
  local_turn_log:
    name: Local Model (keep real requests)
    description: >-
      Keeps in the add-on (/data) every request the local model handled: the
      words, what it did, whether it worked or you corrected it ("non,
      l'autre"). The training set replays them to learn how you speak;
      nothing leaves the house. Empty = on.
  fast_model:
    name: Fast Model (simple commands)
    description: >-
      A cheaper model for plain commands ("allume la lumière du salon", "ferme
      les volets") and quick state questions ("quelle température dans la
      chambre ?"). Everything else (explanations, files, images, analyses)
      stays on the main model. Example on Mistral: ministral-8b-latest or
      mistral-small-latest. If it fails, the main model answers instead.
      Leave empty to use the main model for everything.
  voice_reply_model:
    name: Spoken replies model (local model)
    description: >-
      With the local model, the online model that words what Igor says aloud
      (answers, readings, confirmations). A smaller one answers sooner, in a
      plainer style; the chat panel and everything else keep the main model.
      Example on Mistral: mistral-medium-latest or mistral-small-latest.
      Empty = the main model.
  notify_service:
    name: Notification Service
    description: >-
      Where reminders, scheduled tasks and the morning briefing are sent: a
      notify service of Home Assistant, e.g. mobile_app_pixel_8 for the
      companion app on your phone; a notify entity, e.g.
      notify.telegram_bot_123_456 for a Telegram bot set up from the UI;
      a Telegram notify service (telegram); or telegram_bot (telegram_bot:<chat
      id> for one chat). Leave empty for a notification inside Home Assistant.
  daily_briefing_time:
    name: Morning Briefing Time
    description: >-
      HH:MM, house time (e.g. 07:30). Every day at that time Igor writes a short
      summary (weather, indoor temperatures, yesterday's consumption, anything
      unusual at home), sends it as a notification and keeps it in the
      "Résumé du matin" thread. Each briefing costs one request. Empty = off.
  daily_briefing_prompt:
    name: Morning Briefing Request
    description: >-
      What the morning briefing should contain, written as you would ask Igor.
      Leave empty for the default summary.
  model_prices:
    name: Model Prices (cost counter)
    description: >-
      Prices used by the 💶 cost counter of the panel, as JSON
      {"model-prefix": [input, output]} in USD per million tokens, e.g.
      {"mistral-large": [0.5, 1.5]}. Added to (and overriding) the built-in
      list of common models.
  config_edits:
    name: Configuration Changes
    description: >-
      How far Igor may change your Home Assistant configuration. "off": read
      only (it can still read automations, scripts and YAML and suggest
      changes). "automations" (default): it can create, change and delete
      automations, each previewed and confirmed. "yaml": also edit YAML files
      (scripts.yaml, configuration.yaml, packages…), previewed, confirmed,
      checked by Home Assistant and put back if the check fails. Commands,
      Supervisor actions and login settings are never written, and scheduled
      tasks can never confirm a change.
  rotate_api_token:
    name: Regenerate the API token
    description: >-
      Turn on and restart the add-on to replace the API token (if you think it
      leaked). The option switches itself back off. Restart Home Assistant
      once afterwards so the Igor integration picks up the new token, and
      paste the new key (🔑 in the panel) into the installed app if you use it.
  house_watch:
    name: House Watch
    description: >-
      Lets Igor speak up when something is wrong, through the notification
      service above: a water leak, smoke, a window open for half an hour, a
      low battery, a device that stopped answering, an automation that failed,
      lights left on with everyone out. Plain checks run every 5 minutes for
      free; only something new is judged by the cheap model, which writes the
      notification or decides it is normal. "on" watches the entities exposed
      to Assist, "all" the whole house. Empty or "off" = no watch.
  watch_quiet_hours:
    name: Watch Quiet Hours
    description: >-
      HH:MM-HH:MM, house time. Only safety alarms are sent in this range; the
      rest waits until it ends. Empty = 22:00-07:00.
  watch_max_per_day:
    name: Watch Notifications Per Day
    description: >-
      Most non-urgent watch notifications a day. Safety alarms are never
      capped. Empty = 5.
  watch_lively_time:
    name: Daily Useful Tip Time
    description: >-
      HH:MM. Once a day from this time, Igor looks at the weather and the house
      and tells you only if there is something genuinely useful ("frost
      tonight and the garage window is open"). One cheap request a day. Empty
      = never.
  max_output_tokens:
    name: Maximum Answer Length
    description: >-
      How much room one written answer gets, counted in tokens. Leave this empty
      and Igor chooses for you. Raise it if long answers stop before they
      finish, which is most likely when you ask about several sensors at once or
      over a long period. Longer answers cost a little more. Spoken answers are
      not affected and stay short, because they are read out loud.
  reasoning_effort:
    name: Thinking Effort
    description: >-
      How much the model thinks before it answers. Lower is faster and cheaper,
      which you notice most with voice; higher can help with harder questions.
      Leave empty to use the model's own default. A model that does not support
      this setting simply ignores it. Applies to Assist; chat threads have
      their own setting below.
  extraction_model:
    name: Memory Extraction Model
    description: >-
      Model ID for Igor's background memory pass — the call that rereads each
      conversation turn and stores what was worth remembering. Leave empty to
      use the same model as your main chat model, or point it at a cheaper
      model on the same provider (for example ministral-8b-latest on Mistral)
      to spend less on memory without making the main answers any less smart.
  extraction_gate:
    name: Skip Pointless Memory Extraction
    description: >-
      On by default. After each turn, Igor checks whether the message could
      have taught it anything: a pure command ("turn off the kitchen light"),
      a pure question, or a bare "yes"/"thanks" provably did not, so the
      memory pass is skipped and that API call is never made. Anything that
      might carry a fact — a preference, "remember...", a correction — is
      always extracted. Turn this off to always run the memory pass, at the
      cost of one extra API call per turn.
  memory_learning:
    name: What Igor remembers about you
    description: >-
      "explicit" (default): Igor only remembers what you ask it to remember in
      words ("remember that…", "retiens que…"), and only that. "auto": it also
      keeps whatever it finds worth remembering in any conversation, chat
      threads included.
  contacts_script:
    name: Contacts script
    description: >-
      The Home Assistant script that returns your phone contacts (for example
      script.contacts_recuperer_tous_les_contacts). Igor searches it itself for
      the person to call or text. Empty = the first exposed script with
      "contact" in its id.
  lean_mode:
    name: Lean requests
    description: >-
      On by default. Igor skips the steps that cost time without paying for
      it: the "smart" memory search, the meaning-based search of old messages
      for the voice (it reads its last 20 messages instead), the fast model,
      the second model that checked for orders, six tools of no use in a
      spoken answer. Turn it off to bring everything back.
  watch_entities:
    name: House watch — watched entities
    description: >-
      Optional. The entities the house watch looks at, comma-separated, with *
      for "anything" (binary_sensor.fuite_*, lock.front_door). When filled,
      only these are watched; empty, everything house_watch covers.
  watch_exclude:
    name: House watch — ignored entities
    description: >-
      Entities the house watch never looks at, comma-separated, * allowed
      (binary_sensor.car_*, sensor.*_processor_*).
  layout_from_exposed:
    name: Room map from exposed entities
    description: >-
      On by default. The room map Igor keeps of your home lists the entities you
      have exposed to Assist (Settings, Voice assistants, Expose), which is what
      Home Assistant's own assistant sees too. Turn it off to list entities by
      type instead, as before. This only decides which entities appear in the
      map; what Igor can read and control is the next setting.
  tools_from_exposed:
    name: Limit Igor to exposed entities
    description: >-
      On by default. Igor can read and control only the entities you have
      exposed to Assist (Settings, Voice assistants, Expose), just like Home
      Assistant's own assistant. An exposed group still controls all of its
      members. Something you expose while Igor is running is picked up within
      30 minutes, or straight away after a restart. Turn this off to let Igor
      reach every entity in the house again.
  layout_domains:
    name: Room map entity types
    description: >-
      Advanced. Which entity types go in the room map when it is not built from
      exposed entities: a comma-separated list such as light,switch,climate,sensor,
      or "all" for every entity in the house. Leave empty for a sensible default.
  log_level:
    name: Log Level
    description: >-
      Logging verbosity. Use "debug" for troubleshooting.
network:
  3100/tcp: "Igor app (PWA): give it a host port only to serve the app through your own HTTPS reverse proxy"
