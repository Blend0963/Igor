configuration:
  byok:
    name: "Bring Your Own Key (BYOK)"
    description: >-
      Settings for using your own API key. Your model must support function/tool
      calling, which is how MaDo controls your home. Going deep on local or
      custom models? Only used when LLM Mode is "byok".
    fields:
      provider:
        name: Provider
        description: >-
          Which LLM provider to use. OpenRouter gives access to many models with
          a single key; Mistral connects to Mistral's own chat API.
      api_key:
        name: API Key
        description: >-
          Your API key for the selected provider.
      model:
        name: Model
        description: >-
          Model ID to use. Examples: anthropic/claude-haiku-4.5 (OpenRouter),
          claude-haiku-4-5-20251001 (Anthropic), gpt-4o-mini (OpenAI),
          mistral-small-latest (Mistral). Leave empty for provider default.
      base_url:
        name: API Base URL
        description: >-
          Custom API endpoint. Required for Ollama (e.g. http://homeassistant:11434/v1).
          Leave empty for cloud providers.
  mistral_api_key:
    name: Mistral API Key (Web Search)
    description: >-
      Optional Mistral API key used for Mistral's native web_search tool through
      the Conversations API. This is separate from your selected chat provider.
  custom_prompt:
    name: Custom Prompt
    description: >-
      Give the assistant its personality — whatever you write here replaces the
      default MaDo persona outright, so one sentence describing who it is does
      the job (e.g. "You are HAL 9000, the calm and precise computer from 2001").
      Applies once the add-on restarts. Leave empty for the default MaDo persona.
      This text applies everywhere; the two fields below add to it for one kind
      of conversation only, so shared rules are written once.
  custom_prompt_voice:
    name: Custom Prompt — Voice
    description: >-
      Added after the Custom Prompt for spoken Assist only (satellites, and
      voice on the phone when Assist Mode is "voice"). The place for speaking
      rules: short answers, no formatting, how to say numbers. Leave empty to
      use the Custom Prompt alone.
  custom_prompt_thread:
    name: Custom Prompt — Chat Threads
    description: >-
      Added after the Custom Prompt for threads in the MaDo chat panel only,
      where replies are read on screen: Markdown, code blocks with a copy
      button and longer answers are welcome there. Leave empty to use the
      Custom Prompt alone.
  assist_mode:
    name: Assist Mode
    description: >-
      How MaDo treats Assist requests. "auto" (default) treats only voice
      satellites as spoken, because Home Assistant does not say when you used
      your voice in the phone app. "voice" treats every Assist request as
      spoken, the right choice when you talk to Assist rather than type.
      "text" treats every Assist request as typed. Chat-panel threads are
      never affected.
  memory_token_limit:
    name: Memory Budget (tokens)
    description: >-
      How much of what MaDo remembers about you is sent with each request,
      most relevant first. Every request pays for it, so lower is cheaper.
      Leave empty for 1500, which holds a few dozen facts.
  speech_to_text:
    name: Speech-to-Text (Panel Microphone)
    description: >-
      Transcription for the 🎤 button in the chat panel, done by Mistral's
      Voxtral. "auto" (default) turns it on whenever a Mistral key is set:
      the web-search key above, or your chat key when the provider is
      Mistral. "off" hides the microphone. When on, MaDo also offers itself
      as a speech-to-text engine in Home Assistant's voice assistants.
  max_output_tokens:
    name: Maximum Answer Length
    description: >-
      How much room one written answer gets, counted in tokens. Leave this empty
      and MaDo chooses for you. Raise it if long answers stop before they
      finish, which is most likely when you ask about several sensors at once or
      over a long period. Longer answers cost a little more. Spoken answers are
      not affected and stay short, because they are read out loud.
  reasoning_effort:
    name: Thinking Effort
    description: >-
      How much the model thinks before it answers. Lower is faster and cheaper,
      which you notice most with voice; higher can help with harder questions.
      Leave empty to use the model's own default. A model that does not support
      this setting simply ignores it. On Mistral, only "none" is currently sent.
  extraction_model:
    name: Memory Extraction Model
    description: >-
      Model ID for MaDo's background memory pass — the call that rereads each
      conversation turn and stores what was worth remembering. Leave empty to
      use the same model as your main chat model, or point it at a cheaper
      model on the same provider (for example ministral-8b-latest on Mistral)
      to spend less on memory without making the main answers any less smart.
  extraction_gate:
    name: Skip Pointless Memory Extraction
    description: >-
      On by default. After each turn, MaDo checks whether the message could
      have taught it anything: a pure command ("turn off the kitchen light"),
      a pure question, or a bare "yes"/"thanks" provably did not, so the
      memory pass is skipped and that API call is never made. Anything that
      might carry a fact — a preference, "remember...", a correction — is
      always extracted. Turn this off to always run the memory pass, at the
      cost of one extra API call per turn.
  layout_from_exposed:
    name: Room map from exposed entities
    description: >-
      On by default. The room map MaDo keeps of your home lists the entities you
      have exposed to Assist (Settings, Voice assistants, Expose), which is what
      Home Assistant's own assistant sees too. Turn it off to list entities by
      type instead, as before. This only decides which entities appear in the
      map; what MaDo can read and control is the next setting.
  tools_from_exposed:
    name: Limit MaDo to exposed entities
    description: >-
      On by default. MaDo can read and control only the entities you have
      exposed to Assist (Settings, Voice assistants, Expose), just like Home
      Assistant's own assistant. An exposed group still controls all of its
      members. Something you expose while MaDo is running is picked up within
      30 minutes, or straight away after a restart. Turn this off to let MaDo
      reach every entity in the house again.
  layout_domains:
    name: Room map entity types
    description: >-
      Advanced. Which entity types go in the room map when it is not built from
      exposed entities: a comma-separated list such as light,switch,climate,sensor,
      or "all" for every entity in the house. Leave empty for a sensible default.
  log_level:
    name: Log Level
    description: >-
      Logging verbosity. Use "debug" for troubleshooting.
