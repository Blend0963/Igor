configuration:
  byok:
    name: "Votre propre clé (BYOK)"
    description: >-
      Le fournisseur d'IA et la clé API que MaDo utilise. Le modèle doit savoir
      appeler des outils (function calling) : c'est ainsi que MaDo pilote la
      maison.
    fields:
      provider:
        name: Fournisseur
        description: >-
          Quel fournisseur d'IA utiliser. Mistral se connecte à l'API de Mistral ;
          OpenRouter donne accès à beaucoup de modèles avec une seule clé.
      api_key:
        name: Clé API
        description: >-
          Votre clé API chez ce fournisseur.
      model:
        name: Modèle
        description: >-
          Identifiant du modèle principal, par exemple mistral-large-latest ou
          mistral-small-latest (Mistral), anthropic/claude-haiku-4.5
          (OpenRouter). Vide = le modèle par défaut du fournisseur.
      base_url:
        name: Adresse de l'API
        description: >-
          Adresse personnalisée de l'API. Nécessaire pour Ollama (par exemple
          http://homeassistant:11434/v1). À laisser vide pour les fournisseurs
          en ligne.
  mistral_api_key:
    name: Clé API Mistral (outils de la plateforme)
    description: >-
      Clé Mistral facultative pour les outils de Mistral : recherche web,
      exécution de code, création d'images, bibliothèques de documents,
      connecteurs, lecture des PDF scannés (OCR) et voix Voxtral. Si votre
      fournisseur de chat est Mistral, sa clé est utilisée quand celle-ci est vide.
  custom_prompt:
    name: Personnalité (prompt commun)
    description: >-
      La personnalité de l'assistant, valable partout. Ce texte remplace la
      présentation par défaut de MaDo : une phrase qui dit qui il est suffit.
      Pris en compte au redémarrage de l'add-on. Les deux champs suivants
      s'ajoutent à celui-ci pour un seul type de conversation.
  custom_prompt_voice:
    name: Personnalité — voix
    description: >-
      Ajouté après le prompt commun, seulement pour l'Assist parlé (enceintes
      vocales, et la voix du téléphone quand le mode Assist est « voice »).
      C'est l'endroit des règles orales : réponses courtes, pas de mise en
      forme, façon de dire les nombres.
  custom_prompt_thread:
    name: Personnalité — fils de discussion
    description: >-
      Ajouté après le prompt commun, seulement dans les fils du panneau MaDo,
      lus à l'écran : Markdown, blocs de code et réponses plus longues y sont
      bienvenus.
  assist_mode:
    name: Mode Assist
    description: >-
      Comment MaDo traite les demandes Assist. « auto » (par défaut) : seules
      les enceintes vocales comptent comme parlées, car Home Assistant ne dit
      pas si vous avez parlé dans l'application du téléphone. « voice » : toute
      demande Assist est traitée comme parlée (le bon choix si vous parlez à
      Assist plutôt que d'écrire). « text » : tout est traité comme écrit. Les
      fils du panneau ne sont pas concernés.
  memory_token_limit:
    name: Budget mémoire (tokens)
    description: >-
      Quelle part de ce que MaDo sait sur vous est envoyée avec chaque demande,
      les souvenirs les plus utiles d'abord. Chaque demande la paie : plus bas
      = moins cher, mais MaDo se souvient de moins de choses à la fois. Vide =
      1500, soit quelques dizaines de souvenirs.
  thread_memory:
    name: Mémoire des fils
    description: >-
      Ce que les fils de discussion savent de vous. « shared » (par défaut) :
      une seule mémoire pour Assist et tous les fils. « isolated » : chaque fil
      ne retient que ce qui y a été dit. Dans les deux cas, la conversation
      d'un fil reste la sienne.
  speech_to_text:
    name: Micro du panneau (reconnaissance vocale)
    description: >-
      Transcription du bouton 🎤 du panneau, par Voxtral de Mistral. « auto »
      (par défaut) : actif dès qu'une clé Mistral existe. « off » : pas de
      micro. Actif, MaDo est aussi proposé comme moteur de reconnaissance
      vocale dans les assistants vocaux de Home Assistant.
  thread_reasoning:
    name: Réflexion dans les fils
    description: >-
      Combien le modèle réfléchit avant de répondre dans les fils du panneau.
      Vide = « high » : quelques secondes de plus, des réponses plus
      réfléchies, et plus de tokens. « none » : réponse immédiate, moins chère.
      L'Assist parlé ne réfléchit jamais avant de répondre.
  text_to_speech:
    name: Voix (Voxtral)
    description: >-
      « mistral » donne une voix à MaDo avec Voxtral de Mistral (clé Mistral
      nécessaire) : un bouton 🔊 sous chaque réponse du panneau, et MaDo
      proposé comme voix dans les assistants vocaux de Home Assistant. Vide
      ou « off » : pas de voix.
  tts_voice:
    name: Voix Voxtral
    description: >-
      Identifiant de la voix Voxtral, tel qu'il apparaît dans la console
      Mistral. Vide = la voix par défaut.
  mistral_library_ids:
    name: Bibliothèques de documents Mistral
    description: >-
      Identifiants, séparés par des virgules, des bibliothèques de documents
      Mistral (Le Chat → Bibliothèques) que MaDo peut consulter : notices,
      factures, contrats. Active l'outil search_documents, dans Assist et dans
      les fils.
  mistral_connectors:
    name: Connecteurs Mistral (expérimental)
    description: >-
      Noms ou identifiants, séparés par des virgules, des connecteurs
      configurés dans votre compte Mistral (Gmail, agenda, GitHub, Notion…).
      Active l'outil use_connector dans les fils. MaDo demande confirmation
      avant tout ce qui envoie, réserve ou supprime.
  ocr_price_per_1000_pages:
    name: Prix de l'OCR (pour 1000 pages)
    description: >-
      Sert seulement à l'estimation affichée avant de lire un PDF scanné avec
      l'OCR de Mistral, en dollars pour 1000 pages. Vide = 4. Les PDF qui
      contiennent du texte sont lus gratuitement sur l'add-on, sans OCR.
  fast_model:
    name: Modèle rapide (ordres simples)
    description: >-
      Un modèle moins cher pour les ordres simples (« allume la lumière du
      salon », « ferme les volets ») et les questions d'état rapides (« quelle
      température dans la chambre ? »). Tout le reste (explications, fichiers,
      images, analyses) reste sur le modèle principal. Exemples chez Mistral :
      mistral-small-latest ou ministral-8b-latest. S'il échoue, le modèle
      principal répond. Vide = le modèle principal pour tout.
  notify_service:
    name: Service de notification
    description: >-
      Où envoyer les rappels, les tâches programmées, la veille et le résumé du
      matin : un service notify de Home Assistant (mobile_app_mon_telephone
      pour l'application du téléphone, telegram pour un notify Telegram en
      YAML), une entité notify (notify.telegram_bot_123_456 pour un bot
      Telegram configuré depuis l'interface), ou telegram_bot
      (telegram_bot:<id du chat> pour un chat précis). Vide = une notification
      dans Home Assistant.
  daily_briefing_time:
    name: Heure du résumé du matin
    description: >-
      HH:MM, heure de la maison (par exemple 07:30). Chaque jour à cette heure,
      MaDo écrit un court résumé (météo, températures intérieures,
      consommation de la veille, ce qui sort de l'ordinaire), l'envoie en
      notification et le garde dans le fil « Résumé du matin ». Chaque résumé
      coûte une requête. Vide = pas de résumé.
  daily_briefing_prompt:
    name: Contenu du résumé du matin
    description: >-
      Ce que doit contenir le résumé du matin, écrit comme vous le demanderiez
      à MaDo. Vide = le résumé par défaut.
  model_prices:
    name: Prix des modèles (compteur de coûts)
    description: >-
      Prix utilisés par le compteur 💶 du panneau, en JSON
      {"début-du-nom-du-modèle": [entrée, sortie]}, en dollars par million de
      tokens, par exemple {"mistral-large": [0.5, 1.5]}. S'ajoutent à la liste
      intégrée des modèles courants (et la remplacent pour ces modèles).
  config_edits:
    name: Modifications de la configuration
    description: >-
      Jusqu'où MaDo peut modifier la configuration de Home Assistant. « off » :
      lecture seule (il lit automatisations, scripts et YAML et propose des
      changements). « automations » (par défaut) : il crée, modifie et
      supprime des automatisations, chaque fois avec aperçu et confirmation.
      « yaml » : il modifie aussi les fichiers YAML (scripts.yaml,
      configuration.yaml, packages…), avec aperçu, confirmation, vérification
      par Home Assistant et retour arrière si elle échoue. Les commandes, les
      actions du Supervisor et les réglages de connexion ne sont jamais
      écrits, et une tâche programmée ne peut jamais confirmer une
      modification.
  house_watch:
    name: Veille de la maison
    description: >-
      MaDo vous prévient quand quelque chose cloche, par le service de
      notification ci-dessus : fuite d'eau, fumée, fenêtre ouverte depuis une
      demi-heure, batterie faible, appareil qui ne répond plus, automatisation
      en échec, lumières allumées alors que tout le monde est sorti. Les
      vérifications tournent toutes les 5 minutes, gratuitement ; seul ce qui
      est nouveau est jugé par le modèle rapide, qui écrit la notification ou
      décide que c'est normal. « on » surveille les entités exposées à Assist,
      « all » toute la maison. Vide ou « off » = pas de veille.
  watch_quiet_hours:
    name: Heures calmes de la veille
    description: >-
      HH:MM-HH:MM, heure de la maison. Dans cette plage, seules les alertes de
      sécurité partent ; le reste attend la fin. Vide = 22:00-07:00.
  watch_max_per_day:
    name: Notifications de veille par jour
    description: >-
      Nombre maximal de notifications de veille non urgentes par jour. Les
      alertes de sécurité ne sont jamais limitées. Vide = 5.
  watch_lively_time:
    name: Heure du conseil du jour
    description: >-
      HH:MM. Une fois par jour à partir de cette heure, MaDo regarde la météo et
      la maison et vous écrit seulement s'il y a quelque chose de vraiment
      utile (« gel cette nuit et la fenêtre du garage est ouverte »). Une
      requête bon marché par jour. Vide = jamais.
  max_output_tokens:
    name: Longueur maximale d'une réponse
    description: >-
      La place d'une réponse écrite, en tokens. Vide = MaDo choisit. À
      augmenter si de longues réponses s'arrêtent avant la fin. Les réponses
      parlées ne sont pas concernées.
  reasoning_effort:
    name: Réflexion (Assist)
    description: >-
      Combien le modèle réfléchit avant de répondre dans Assist. Plus bas =
      plus rapide et moins cher, ce qui se sent surtout à la voix ; plus haut
      peut aider sur les questions difficiles. Vide = le réglage du modèle
      (et aucune réflexion à la voix). Les fils ont leur propre réglage.
  extraction_model:
    name: Modèle de la mémoire
    description: >-
      Le modèle qui, après chaque échange, relit la conversation et retient
      ce qui vaut la peine d'être retenu. Vide = le modèle principal. Un
      modèle moins cher chez le même fournisseur (par exemple
      ministral-8b-latest chez Mistral) coûte moins sans rendre les réponses
      moins bonnes. Il écrit aussi les titres des nouveaux fils.
  extraction_gate:
    name: Éviter les relectures mémoire inutiles
    description: >-
      Actif par défaut. Après chaque échange, MaDo vérifie si votre message
      pouvait lui apprendre quelque chose. Un ordre seul (« éteins la
      cuisine »), une simple question ou un « oui » / « merci » n'apprennent
      rien : la relecture mémoire est sautée et cet appel n'est pas payé. Tout
      ce qui peut contenir une information (une préférence, « souviens-toi… »,
      une correction) est toujours relu. « off » = toujours relire, au prix
      d'un appel de plus par échange.
  layout_from_exposed:
    name: Plan de la maison depuis les entités exposées
    description: >-
      Actif par défaut. Le plan de la maison que MaDo garde en tête liste les
      entités exposées à Assist (Paramètres → Assistants vocaux → Exposer),
      comme l'assistant de Home Assistant. Désactivé, les entités sont choisies
      par type.
  tools_from_exposed:
    name: Limiter MaDo aux entités exposées
    description: >-
      Actif par défaut. MaDo ne peut lire et piloter que les entités exposées
      à Assist, comme l'assistant de Home Assistant. Une entité exposée
      pendant que MaDo tourne est prise en compte sous 30 minutes, ou tout de
      suite après un redémarrage. Désactivé, MaDo peut atteindre toute la
      maison.
  layout_domains:
    name: Types d'entités du plan
    description: >-
      Avancé. Les types d'entités du plan quand il n'est pas construit depuis
      les entités exposées : liste séparée par des virgules (par exemple
      light,switch,climate,sensor), ou « all » pour tout. Vide = un choix
      raisonnable.
  log_level:
    name: Niveau de journal
    description: >-
      Détail du journal de l'add-on. « debug » pour chercher un problème.
network:
  3100/tcp: "Application MaDo (PWA) : à ouvrir seulement pour servir l'application derrière votre propre proxy HTTPS"
