name: Build and Push Add-on

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The job token gets only what the jobs need. Without this it inherits the
# repository default, which CodeQL flags (actions/missing-workflow-permissions);
# a job that needs more, such as pushing an image, says so on the job itself.
permissions:
  contents: read

jobs:
  test:
    name: Test server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/src/home-mind-server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/src/home-mind-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Get add-on version
        id: version
        run: |
          VERSION=$(grep '^version:' nives/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version is never overwritten: users who pulled it keep
      # exactly that image. A push to master without a version bump builds
      # (as a check) but does not publish.
      - name: Check whether this version is already published
        id: published
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "ghcr.io/blend0963/mado-${{ matrix.arch }}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::mado-${{ matrix.arch }}:${{ steps.version.outputs.version }} is already published; not overwriting it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./nives/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' && steps.published.outputs.exists != 'true' }}
          tags: |
            ghcr.io/blend0963/mado-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/blend0963/mado-${{ matrix.arch }}:latest
          build-args: |
            S6_OVERLAY_VERSION=3.2.0.2
            SHODH_VERSION=v0.2.0
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
