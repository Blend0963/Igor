# mado-ear settings. Copied to ~/.config/mado-ear/config.toml by install.sh;
# edit that copy, then: systemctl --user restart mado-ear

[mode]
# false: observation only, nothing is sent (notes in ~/.local/state/mado-ear).
# true: sentences that name MaDo go to MaDo and the satellite answers.
act = false
# Right after MaDo asks a question, take the answer without the name.
followup = true
# After "MaDo" said alone, how long to wait for the order (seconds).
name_wait = 6

[audio]
# The microphone, from `pactl list short sources`.
source = "alsa_input.usb-Generalplus_Usb_Audio_Device-00.mono-fallback"

[stt]
# Local transcription, used only to hear the name; MaDo gets the audio
# itself, transcribed by the Assist pipeline (Voxtral).
model = "base"       # on a CPU: base (tiny hears too little; small is slow)
device = "auto"      # auto (GPU, else CPU), cuda or cpu
language = "fr"
cpu_threads = 2      # used only on the CPU fallback
hotwords = "MaDo"    # words Whisper should expect: it then writes the name right

[home_assistant]
# Needed for act mode; also used in observation mode to stay quiet while
# the satellite is busy and, optionally, while nobody is home.
url = ""                       # e.g. "http://homeassistant.local:8123"
token = ""                     # a long-lived access token (Profile > Security)
satellite = ""                 # e.g. "assist_satellite.hub_audio": its voice answers
pipeline = ""                  # empty: the preferred Assist pipeline
presence_entity = ""           # e.g. "binary_sensor.presence"; empty: always listen
home_states = ["on", "home"]

[log]
# Notes kept in ~/.local/state/mado-ear/observations.jsonl, on this machine only.
keep_days = 7
# Also note the text of sentences that were NOT for MaDo. Turn off once
# the name detection is judged.
rejected_text = true
