# igor-ear settings. Copied to ~/.config/igor-ear/config.toml by install.sh;
# edit that copy, then: systemctl --user restart igor-ear

[mode]
# How Igor knows a sentence is for it:
#   "name":  "Igor" said somewhere in the sentence (the safe default)
#   "smart": also without the name, when a small AI on this machine judges
#            it is a request for the house (see [smart] and ear/README.md)
addressing = "name"
# false: observation only, nothing is sent (notes in ~/.local/state/igor-ear).
# true: sentences that name Igor go to Igor and the satellite answers.
act = false
# Right after Igor asks a question, take the answer without the name.
followup = true
# How long Igor listens for that answer (seconds); the tablet shows it.
followup_seconds = 8
# After "Igor" said alone, how long to wait for the order (seconds).
name_wait = 8
# What Igor answers aloud to its name said alone, one at random; [] for silence.
name_reply = ["Oui ?", "Je vous écoute.", "Oui, monsieur ?", "À votre écoute.", "Je suis là."]
# A pause shorter than this does not end a sentence (seconds). Shorter answers
# sooner; longer lets you hesitate mid-sentence.
join_gap = 0.6

[audio]
# The microphone, from `pactl list short sources`.
source = "alsa_input.usb-Generalplus_Usb_Audio_Device-00.mono-fallback"

[stt]
# Local transcription, used only to hear the name; Igor gets the audio
# itself, transcribed by the Assist pipeline (Voxtral).
model = "base"       # on a CPU: base (tiny hears too little; small is slow)
device = "auto"      # auto (GPU, else CPU), cuda or cpu
language = "fr"
cpu_threads = 2      # used only on the CPU fallback
hotwords = "Igor"    # words Whisper should expect: it then writes the name right
beam_size = 0        # 0: 5 on a GPU (hears the name better), 1 on a CPU

[home_assistant]
# Needed for act mode; also used in observation mode to stay quiet while
# the satellite is busy and, optionally, while nobody is home.
url = ""                       # e.g. "http://homeassistant.local:8123"
token = ""                     # a long-lived access token (Profile > Security)
satellite = ""                 # e.g. "assist_satellite.hub_audio": its voice answers
pipeline = ""                  # empty: the preferred Assist pipeline
presence_entity = ""           # e.g. "binary_sensor.presence"; empty: always listen
home_states = ["on", "home"]

[log]
# Notes kept in ~/.local/state/igor-ear/observations.jsonl, on this machine only.
keep_days = 7
# Also note the text of sentences that were NOT for Igor. Turn off once
# the name detection is judged.
rejected_text = true

[smart]
# Used only with [mode] addressing = "smart". The AI runs in Ollama on this
# machine: nothing heard leaves the house.
url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"       # ~2.5 GB of memory; 2-3 s per judged sentence on 4 CPU cores
# false: Igor only notes what it would have done ("WOULD ACT" in the journal);
# true: it acts. Leave false for a few days and read the journal first.
act = false

[media]
# Sound in the house: a television, the radio, a phone over Bluetooth.
# Where it is heard:
#   "speakers": what comes out of this machine's speakers (anything it
#               plays); a muted output or one at 0 % counts as silence
#   "players":  the Home Assistant media players listed below
#   "both"
sound_from = "speakers"
sink = "@DEFAULT_SINK@"    # the output to watch (pactl list short sinks)
quiet_db = -50             # below this level, silence (run.sh sound to measure)
media_players = []         # for "players": e.g. ["media_player.nvidia_shield"]
# While sound plays:
#   "name":   only the name works (the smart judge pauses; in "name" mode
#             nothing changes)
#   "closed": nothing is heard, not even the name, in either mode; Igor still
#             hears the answer to a question it has just asked
when_media = "name"
