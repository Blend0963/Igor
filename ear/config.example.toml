# mado-ear settings. Copied to ~/.config/mado-ear/config.toml by install.sh;
# edit that copy, then: systemctl --user restart mado-ear

[audio]
# The microphone, from `pactl list short sources`.
source = "alsa_input.usb-Generalplus_Usb_Audio_Device-00.mono-fallback"

[stt]
model = "small"      # small fits the GTX 960's 2 GB in float32
device = "auto"      # auto (GPU, else CPU), cuda or cpu
language = "fr"
cpu_threads = 2      # used only on the CPU fallback

[addressing]
# Your own names for things, counted as "something the house has":
# extra_targets = ["lampe de chevet", "guirlande", "hotte"]
extra_targets = []

[home_assistant]
# Optional: listen only while this entity says someone is home.
# url = "http://homeassistant.local:8123"
# token = "a long-lived access token"   (Profile > Security in Home Assistant)
# presence_entity = "binary_sensor.presence"
url = ""
token = ""
presence_entity = ""
home_states = ["on", "home"]

[log]
# Notes kept in ~/.local/state/mado-ear/observations.jsonl, on this machine only.
keep_days = 7
# Also note the text of sentences that were NOT for MaDo, to spot the ones
# it should have taken. Turn off once the rules are judged.
rejected_text = true
