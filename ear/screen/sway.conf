# Igor's desk screen: one window, the wall dashboard, nothing else.
# Started by greetd at boot (install-vm.sh); WLR_DRM_DEVICES keeps it on the
# graphics card's own outputs, not the virtual machine's console screen.
output * bg #0d1014 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 3000
input type:keyboard xkb_layout fr
# Chromium in fullscreen, so its own bar never shows. While a settings
# window is open it leaves fullscreen (sway would hide the window behind it);
# igor-screen puts it back once no settings window is left.
for_window [app_id="^chromium"] fullscreen enable
# The settings windows opened from the dashboard (Son, Égaliseur, Bluetooth):
# floating over it, the dashboard's « Fermer » button closes them.
for_window [app_id="^(org\.pulseaudio\.pavucontrol|pavucontrol|com\.github\.wwmm\.easyeffects|blueman-manager|\.blueman-manager-wrapped)$"] floating enable, border normal 2, resize set 70 ppt 80 ppt, move position center, focus
# The services see this session (swaymsg puts the screen to sleep).
exec systemctl --user import-environment SWAYSOCK WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec systemctl --user restart igor-screen.service
exec ~/.local/share/igor-ear/screen/kiosk.sh
# What the desktop session used to start: EasyEffects (always running, the
# television's sound goes through it) and Bluetooth's agent (pairing, reconnecting).
exec easyeffects --gapplication-service
exec blueman-applet
# Asleep (the output switched off by igor-screen or Home Assistant), a key or
# the mouse wakes the screen: swayidle's « resume » runs on the first input
# after two idle seconds. igor-screen sees it and tells Home Assistant.
exec swayidle -w timeout 2 'true' resume 'swaymsg "output * power on"'
# The only shortcut: Ctrl+Alt+Backspace leaves the kiosk (greetd's login comes back).
bindsym Ctrl+Mod1+BackSpace exit
