# Igor's desk screen: one window, the wall dashboard, nothing else.
# Started by greetd at boot (install-vm.sh); WLR_DRM_DEVICES keeps it on the
# graphics card's own outputs, not the virtual machine's console screen.
output * bg #0d1014 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 3000
input type:keyboard xkb_layout fr
for_window [app_id="chromium"] fullscreen enable
# The services see this session (swaymsg puts the screen to sleep).
exec systemctl --user import-environment SWAYSOCK WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec systemctl --user restart igor-screen.service
exec ~/.local/share/igor-ear/screen/kiosk.sh
# The only shortcut: Ctrl+Alt+Backspace leaves the kiosk (greetd's login comes back).
bindsym Ctrl+Mod1+BackSpace exit
