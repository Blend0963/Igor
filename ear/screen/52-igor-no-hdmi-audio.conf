# The graphics card's HDMI sound (the monitor's speakers) is not used: Igor
# and the house keep speaking through the sound card.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "~HDA ATI HDMI.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
