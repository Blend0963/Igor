        o.textContent = m.id.replace(/-latest$/, "") + (m.role === "main" ? " (principal)" : m.role === "fast" ? " (rapide)" : "") + (m.vision ? " 👁" : "");
        o.title = m.id;
        sel.appendChild(o);
      });
      showPick();
    }).catch(function () { showPick(); });
  }

  // ----- stop button -----

  function refreshSendButton() {
    var btn = el("btn-send");
    var running = Boolean(state.current && isRunning(state.current));
    btn.classList.toggle("stop", running);
    btn.textContent = running ? "■" : "↑";
    btn.title = running ? "Arrêter la réponse (le début est gardé)" : "Envoyer";
    btn.setAttribute("aria-label", running ? "Arrêter la réponse" : "Envoyer");
    btn.disabled = !running && state.busy;
  }

  function stopCurrent() {
    var id = state.current;
    if (!id) return;
    setStatus("Arrêt…");
    api("api/running/" + USER_ID + "/" + encodeURIComponent(id) + "/stop", { method: "POST" })
      .catch(function (err) { setStatus("Arrêt impossible : " + err.message, true); });
  }

  // ----- edit and regenerate -----
  //
  // The last question can be edited and the last answer regenerated: the
  // server forgets that message and everything after it, then the question
  // is sent again.

  function decorateLast(messages) {
    var boxes = el("messages").querySelectorAll(".msg[data-id]");
    var lastUser = null, lastAssistant = null;
    Array.prototype.forEach.call(boxes, function (b) {
      if (b.classList.contains("user")) lastUser = b; else lastAssistant = b;
    });
    var lastMsg = messages[messages.length - 1];
    if (lastUser) addAction(lastUser, "✎", "Modifier et renvoyer", function () { editFrom(lastUser); });
    if (lastAssistant && lastMsg && lastMsg.role === "assistant" && lastUser) {
      addAction(lastAssistant, "↻", "Régénérer la réponse", function () { regenerate(lastUser); });
    }
  }

  function addAction(box, label, title, fn) {
    var bar = box.querySelector(".msg-actions");
    if (!bar) {
      bar = document.createElement("div");
      bar.className = "msg-actions";
      box.appendChild(bar);
    }
    var b = document.createElement("button");
    b.type = "button";
    b.className = "msg-act";
    b.textContent = label;
    b.title = title;
    b.addEventListener("click", function () { if (!state.busy) fn(); });
    bar.appendChild(b);
  }

  function userText(box) {
    return (box.dataset.text || "").replace(/\n*<document name="[^"]*">[\s\S]*?(<\/document>|$)/g, "").trim();
  }

  function dropFrom(box) {
    while (box.nextSibling) box.parentNode.removeChild(box.nextSibling);
    box.parentNode.removeChild(box);
  }

  function truncateFrom(box) {
    return api("api/conversations/" + USER_ID + "/" + encodeURIComponent(state.current) + "/truncate", {
      method: "POST",
      body: JSON.stringify({ messageId: box.dataset.id })
    });
  }

  function editFrom(box) {
    var input = el("input");
    input.value = userText(box);
    autoGrow();
    input.focus();
    state.editFrom = box;
    setStatus("Modification du dernier message : envoyez pour remplacer la suite.");
  }

  function regenerate(userBox) {
    var text = userText(userBox);
    if (!text) return;
    truncateFrom(userBox).then(function () {
      dropFrom(userBox);
      send(text, [], text);
    }).catch(function (err) { setStatus("Impossible de régénérer : " + err.message, true); });
  }

  // ----- search -----

  var searchTimer = null;
  el("search").addEventListener("input", function () {
    clearTimeout(searchTimer);
    var q = el("search").value.trim();
    if (q.length < 2) { state.searching = false; renderThreads(state.threads); return; }
    searchTimer = setTimeout(function () {
      api("api/search/" + USER_ID + "?q=" + encodeURIComponent(q))
        .then(function (res) { return res.json(); })
        .then(function (hits) { if (el("search").value.trim() === q) renderHits(hits, q); })
        .catch(function (err) { setStatus("Recherche impossible : " + err.message, true); });
    }, 300);
  });

  function renderHits(hits, q) {
    state.searching = true;
    var nav = el("threads");
    nav.textContent = "";
    if (!hits.length) {
      var none = document.createElement("div");
      none.className = "muted";
      none.style.padding = "10px";
      none.textContent = "Aucun résultat.";
      nav.appendChild(none);
      return;
    }
    hits.forEach(function (h) {
      var row = document.createElement("div");
      row.className = "hit-row";
      var t = document.createElement("div");
      t.className = "hit-title";
      t.textContent = (h.title || "Fil") + (h.role === "assistant" ? " · MaDo" : "");
      var snip = document.createElement("div");
      snip.className = "hit-snip";
      var text = h.snippet || "";
      var at = text.toLowerCase().indexOf(q.toLowerCase());
      if (at >= 0) {
        snip.appendChild(document.createTextNode(text.slice(0, at)));
        var mark = document.createElement("mark");
        mark.textContent = text.slice(at, at + q.length);
        snip.appendChild(mark);
        snip.appendChild(document.createTextNode(text.slice(at + q.length)));
      } else snip.textContent = text;
      row.appendChild(t);
      row.appendChild(snip);
      row.addEventListener("click", function () { openThread(h.conversationId); });
      nav.appendChild(row);
    });
  }

  // ----- projects -----
  //
  // Threads can be grouped in projects, each with its own instructions,
  // added to the persona of its threads on the server.

  state.projects = [];
  state.projectFilter = "";

  function loadProjects() {
    return api("api/projects/" + USER_ID)
      .then(function (res) { return res.json(); })
      .then(function (list) { state.projects = Array.isArray(list) ? list : []; renderProjectSelect(); })
      .catch(function () { state.projects = []; renderProjectSelect(); });
  }

  function renderProjectSelect() {
    var sel = el("project");
    sel.textContent = "";
    function opt(value, label) {
      var o = document.createElement("option");
      o.value = value;
      o.textContent = label;
      sel.appendChild(o);
    }
    opt("", "📂 Tous les fils");
    state.projects.forEach(function (p) { opt(p.id, "📁 " + p.name); });
    opt("__new", "＋ Nouveau projet…");
    if (state.projectFilter && !state.projects.some(function (p) { return p.id === state.projectFilter; })) state.projectFilter = "";
    sel.value = state.projectFilter;
    el("btn-project-edit").hidden = !state.projectFilter;
    el("btn-move").hidden = !state.current || !state.projects.length;
  }

  el("project").addEventListener("change", function () {
    var v = el("project").value;
    if (v === "__new") { el("project").value = state.projectFilter; projectForm(null); return; }
    state.projectFilter = v;
    el("btn-project-edit").hidden = !v;
    renderThreads(state.threads);
  });
  el("btn-project-edit").addEventListener("click", function () {
    projectForm(state.projects.filter(function (p) { return p.id === state.projectFilter; })[0] || null);
  });

  function projectForm(project) {
    openPanel(project ? "Projet « " + project.name + " »" : "Nouveau projet", function (body, close) {
      var form = document.createElement("div");
      form.className = "pm-form";
      var name = document.createElement("input");
      name.placeholder = "Nom du projet";
      name.maxLength = 80;
      name.value = project ? project.name : "";
      var instr = document.createElement("textarea");
      instr.placeholder = "Instructions pour les fils de ce projet (facultatif). Ex. : « Tu m'aides à rénover la salle de bain ; budget 8 000 €, travaux en mars. »";
      instr.maxLength = 8000;
      instr.value = project ? project.instructions : "";
      var row = document.createElement("div");
      row.className = "pm-row";
      var save = button("Enregistrer", "", function () {
        var payload = JSON.stringify({ name: name.value, instructions: instr.value });
        var req = project
          ? api("api/projects/" + USER_ID + "/" + project.id, { method: "PATCH", body: payload })
          : api("api/projects/" + USER_ID, { method: "POST", body: payload }).then(function (res) { return res.json(); }).then(function (p) { state.projectFilter = p.id; });
        req.then(function () { close(); return loadProjects(); }).then(function () { renderThreads(state.threads); })
          .catch(function (err) { setStatus("Projet non enregistré : " + err.message, true); });
      });
      row.appendChild(save);
      if (project) {
        row.appendChild(button("Supprimer le projet", "danger", function () {
          if (!window.confirm("Supprimer ce projet ? Ses fils sont gardés, hors projet.")) return;
          api("api/projects/" + USER_ID + "/" + project.id, { method: "DELETE" })
            .then(function () { state.projectFilter = ""; close(); return loadProjects(); })
            .then(refreshThreads)
            .catch(function (err) { setStatus(err.message, true); });
        }));
      }
      form.appendChild(name);
      form.appendChild(instr);
      form.appendChild(row);
      body.appendChild(form);
      name.focus();
    });
  }

  function assignProject(id, projectId) {
    return api("api/conversations/" + USER_ID + "/" + encodeURIComponent(id) + "/project", {
      method: "PUT",
      body: JSON.stringify({ projectId: projectId || null })
    });
  }

  el("btn-move").addEventListener("click", function () {
    var id = state.current;
    var known = state.threads.filter(function (t) { return t.conversationId === id; })[0];
    openPanel("Ranger dans un projet", function (body, close) {
      var list = document.createElement("div");
      list.className = "pm-list";
      [{ id: "", name: "Aucun projet" }].concat(state.projects).forEach(function (p) {
        var current = (known && known.projectId || "") === p.id;
        list.appendChild(button((current ? "✓ " : "") + (p.id ? "📁 " : "") + p.name, current ? "" : "secondary", function () {
          assignProject(id, p.id).then(function () { close(); return refreshThreads(); })
            .catch(function (err) { setStatus(err.message, true); });
        }));
      });
      body.appendChild(list);
    });
  });

  // ----- export -----

  el("btn-export").addEventListener("click", function () {
    var id = state.current;
    openPanel("Exporter ce fil", function (body, close) {
      var row = document.createElement("div");
      row.className = "pm-row";
      [["pdf", "PDF"], ["docx", "Word"], ["md", "Markdown"]].forEach(function (f) {
        row.appendChild(button(f[1], "secondary", function () {
          fetch("api/conversations/" + USER_ID + "/" + encodeURIComponent(id) + "/export?format=" + f[0], { headers: authHeaders() })
            .then(function (res) {
              if (!res.ok) throw new Error("HTTP " + res.status);
              var cd = res.headers.get("content-disposition") || "";
              var m = /filename\*=UTF-8''([^;]+)/.exec(cd);
              var name = m ? decodeURIComponent(m[1]) : "fil." + f[0];
              return res.blob().then(function (blob) { saveBlob(blob, name); close(); });
            })
            .catch(function (err) { setStatus("Export impossible : " + err.message, true); });
        }));
      });
      body.appendChild(row);
    });
  });

  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // ----- side panels: memory, tasks, costs, diagnostic -----

  function button(label, kind, fn) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pm-btn" + (kind ? " " + kind : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }

  function note(text) {
    var p = document.createElement("p");
    p.className = "pm-note";
    p.textContent = text;
    return p;
  }

  function openPanel(title, build) {
    var modal = el("panel-modal");
    el("pm-title").textContent = title;
    var body = el("pm-body");
    body.textContent = "";
    function close() { modal.hidden = true; body.textContent = ""; }
    el("pm-close").onclick = close;
    modal.onclick = function (ev) { if (ev.target === modal) close(); };
    modal.hidden = false;
    build(body, close);
  }

  var CATEGORIES = { identity: "Identité", preference: "Préférence", baseline: "Repère", device: "Appareil", pattern: "Habitude", correction: "Correction" };

  el("btn-memory").addEventListener("click", function () {
    openPanel("🧠 Ce que MaDo retient", function (body) {
      var list = document.createElement("div");
      list.className = "pm-list";
      function load() {
        list.textContent = "Chargement…";
        api("api/memory/" + USER_ID).then(function (res) { return res.json(); }).then(function (data) {
          var facts = (data && data.facts) || [];
          list.textContent = "";
          if (!facts.length) list.appendChild(note("Rien pour l'instant. MaDo apprend au fil des conversations, ou ajoutez un souvenir ci-dessous."));
          facts.sort(function (a, b) { return String(a.category).localeCompare(String(b.category)); }).forEach(function (f) {
            var item = document.createElement("div");
            item.className = "pm-item";
            var grow = document.createElement("div");
            grow.className = "grow";
            grow.textContent = f.content;
            var sub = document.createElement("div");
            sub.className = "sub";
            sub.textContent = CATEGORIES[f.category] || f.category;
            grow.appendChild(sub);
            var edit = document.createElement("button");
            edit.type = "button"; edit.className = "mini"; edit.textContent = "✎"; edit.title = "Corriger";
            edit.addEventListener("click", function () {
              content.value = f.content;
              category.value = f.category;
              replacing = f.id;
              content.focus();
            });
            var del = document.createElement("button");
            del.type = "button"; del.className = "mini"; del.textContent = "🗑"; del.title = "Oublier";
            del.addEventListener("click", function () {
              api("api/memory/" + USER_ID + "/facts/" + encodeURIComponent(f.id), { method: "DELETE" }).then(load)
                .catch(function (err) { setStatus(err.message, true); });
            });
            item.appendChild(grow);
            item.appendChild(edit);
            item.appendChild(del);
            list.appendChild(item);
          });
        }).catch(function (err) { list.textContent = "Mémoire indisponible : " + err.message; });
      }
      var replacing = null;
      var form = document.createElement("div");
      form.className = "pm-form";
      var content = document.createElement("textarea");
      content.placeholder = "Un souvenir à ajouter ou corriger. Ex. : « Ma fille s'appelle Léa. »";
      content.style.minHeight = "60px";
      var category = document.createElement("select");
      Object.keys(CATEGORIES).forEach(function (k) {
        var o = document.createElement("option");
        o.value = k; o.textContent = CATEGORIES[k];
        category.appendChild(o);
      });
      category.value = "preference";
      var row = document.createElement("div");
      row.className = "pm-row";
      row.appendChild(category);
      row.appendChild(button("Enregistrer", "", function () {
        var text = content.value.trim();
        if (!text) return;
        var old = replacing;
        api("api/memory/" + USER_ID + "/facts", { method: "POST", body: JSON.stringify({ content: text, category: category.value }) })
          .then(function () { return old ? api("api/memory/" + USER_ID + "/facts/" + encodeURIComponent(old), { method: "DELETE" }) : null; })
          .then(function () { content.value = ""; replacing = null; load(); })
          .catch(function (err) { setStatus("Souvenir non enregistré : " + err.message, true); });
      }));
      form.appendChild(content);
      form.appendChild(row);
      body.appendChild(list);
      body.appendChild(form);
      load();
    });
  });

  el("btn-tasks").addEventListener("click", function () {
    openPanel("⏰ Rappels et tâches", function (body) {
      var list = document.createElement("div");
      list.className = "pm-list";
      body.appendChild(note("Pour en créer, demandez simplement à MaDo : « rappelle-moi de sortir les poubelles mardi à 19 h », « chaque dimanche à 18 h, fais le bilan énergie de la semaine ». Les rappels sont gratuits ; une tâche coûte une requête à chaque exécution."));
      body.appendChild(list);
      function load() {
        list.textContent = "Chargement…";
        api("api/tasks/" + USER_ID).then(function (res) { return res.json(); }).then(function (tasks) {
          list.textContent = "";
          if (!tasks.length) list.appendChild(note("Aucun rappel ni tâche programmée."));
          tasks.forEach(function (t) {
            var item = document.createElement("div");
            item.className = "pm-item";
            var grow = document.createElement("div");
            grow.className = "grow";
            grow.textContent = (t.kind === "reminder" ? "⏰ " : "🤖 ") + t.text;
            var sub = document.createElement("div");
            sub.className = "sub";
            sub.textContent = t.description + (t.schedule && t.schedule.type === "when" ? "" : " · prochaine : " + new Date(t.nextRunAt).toLocaleString()) +
              (t.builtin ? " · réglé dans les options de l'add-on" : "") + (t.lastError ? " · dernière erreur : " + t.lastError : "");
            grow.appendChild(sub);
            item.appendChild(grow);
            if (!t.builtin) {
              var del = document.createElement("button");
              del.type = "button"; del.className = "mini"; del.textContent = "🗑"; del.title = "Annuler";
              del.addEventListener("click", function () {
                api("api/tasks/" + USER_ID + "/" + encodeURIComponent(t.id), { method: "DELETE" }).then(load)
                  .catch(function (err) { setStatus(err.message, true); });
              });
              item.appendChild(del);
            }
            list.appendChild(item);
          });
        }).catch(function (err) { list.textContent = "Indisponible : " + err.message; });
      }
      load();
    });
  });

  el("btn-costs").addEventListener("click", function () {
    openPanel("💶 Coûts des 30 derniers jours", function (body) {
      body.appendChild(note("Chargement…"));
      api("api/usage/" + USER_ID + "?days=30").then(function (res) { return res.json(); }).then(function (u) {
        body.textContent = "";
        var big = document.createElement("div");
        big.className = "pm-big";
        big.textContent = "≈ " + money(u.total || 0);
        body.appendChild(big);
        var calls = (u.byDay || []).reduce(function (n, d) { return n + d.calls; }, 0);
        body.appendChild(note(calls + " appels au modèle. Estimation aux tarifs publics, en dollars : les échanges avec le modèle de chat seulement (titres, mémoire, OCR, images et recherche web en plus, non comptés)." +
          (u.unpriced ? " " + u.unpriced + " requête(s) sur un modèle sans tarif connu (option model_prices)." : "")));
        if ((u.byDay || []).length) {
          var spec = normalizeChart({
            type: "bar", title: "Coût par jour", unit: "$",
            labels: u.byDay.map(function (d) { return d.day.slice(8, 10) + "/" + d.day.slice(5, 7); }),
            series: [{ name: "Coût", data: u.byDay.map(function (d) { return Math.round(d.cost * 10000) / 10000; }) }]
          });
          if (spec) body.appendChild(chartBlock(spec));
        }
        if ((u.byConversation || []).length) {
          body.appendChild(table([["Fil", "Appels", "Coût"]].concat(u.byConversation.map(function (c) { return [c.title, String(c.calls), money(c.cost)]; })), ["", "right", "right"]));
        }
        if ((u.byModel || []).length) {
          body.appendChild(table([["Modèle", "Appels", "Coût"]].concat(u.byModel.map(function (m) { return [m.model, String(m.calls), money(m.cost)]; })), ["", "right", "right"]));
        }
      }).catch(function (err) { body.textContent = "Compteur indisponible : " + err.message; });
    });
  });

  el("btn-diag").addEventListener("click", function () {
    openPanel("🩺 Diagnostic", function (body) {
      var out = document.createElement("div");
      out.className = "pm-list";
      var row = document.createElement("div");
      row.className = "pm-row";
      function run(paid) {
        out.textContent = "Vérification…";
        api("api/diagnostics", { method: "POST", body: JSON.stringify({ paid: paid }) })
          .then(function (res) { return res.json(); })
          .then(function (results) {
            out.textContent = "";
            results.forEach(function (r) {
              var item = document.createElement("div");
              item.className = "pm-item";
              var icon = document.createElement("span");
              icon.className = r.skipped ? "diag-skip" : r.ok ? "diag-ok" : "diag-ko";
              icon.textContent = r.skipped ? "⏭" : r.ok ? "✅" : "❌";
              var grow = document.createElement("div");
              grow.className = "grow";
              grow.textContent = r.name;
              var sub = document.createElement("div");
              sub.className = "sub";
              sub.textContent = r.detail;
              grow.appendChild(sub);
              item.appendChild(icon);
              item.appendChild(grow);
              out.appendChild(item);
            });
          })
          .catch(function (err) { out.textContent = "Diagnostic impossible : " + err.message; });
      }
      row.appendChild(button("Lancer (gratuit)", "", function () { run(false); }));
      row.appendChild(button("Inclure OCR et voix (≈ 0,01 $)", "secondary", function () { run(true); }));
      body.appendChild(note("Vérifie Home Assistant, la mémoire, la clé et les modèles Mistral. Les tests payants lisent une page par OCR et synthétisent puis retranscrivent une phrase."));
      body.appendChild(row);
      body.appendChild(out);
      run(false);
    });
  });

  // ----- boot -----

  api("api/health")
    .then(function (res) { return res.json(); })
    .then(function (h) {
      el("health").textContent = "v" + (h.version || "?");
      // The microphone needs the server's transcription; without it the
      // button would only ever answer with an error.
      el("btn-mic").hidden = !h.stt;
      state.caps = h;
      if (h.documents) {
        el("file-attach").removeAttribute("accept");
        el("btn-attach").title = "Joindre une image ou un fichier (PDF, Word, Excel, zip…)";
      }
      // Replies already on screen get their 🔊 once the server says it speaks.
      if (h.tts) Array.prototype.forEach.call(document.querySelectorAll(".msg.assistant"), addSpeak);
    })
    .catch(function () {});
  loadProjects();
  loadModels();
  refreshThreads().then(syncRunning).then(receiveShare, receiveShare);

  // ----- installed app -----
  //
  // Opened on its own (not inside Home Assistant's frame) over HTTPS, the
  // panel registers its service worker, which makes it installable and puts
  // MaDo in the phone's Share menu. Inside HA ingress it stays a plain page.
  var framed = false;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed && "serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  // What the Share menu sent: the service worker kept it in a cache and
  // opened "?share=1". It goes into the composer of a new thread, to be
  // sent as it is or with a question.
  function receiveShare() {
    if (!/[?&]share=1\b/.test(location.search)) return;
    history.replaceState(null, "", location.pathname);
    if (!window.caches) return;
    var box;
    return caches.open("mado-share-v1")
      .then(function (cache) {
        box = cache;
        return cache.match("share/meta");
      })
      .then(function (res) { return res ? res.json() : null; })
      .then(function (meta) {
        if (!meta) return;
        newThread();
        var text = [meta.title, meta.text, meta.url].filter(function (t, i, all) {
          return t && all.indexOf(t) === i && !(i < 2 && meta.url && t === meta.url);
        }).join("\n");
        if (text) {
          el("input").value = text;
          el("input").dispatchEvent(new Event("input"));
        }
        return Promise.all(meta.files.map(function (f) {
          return box.match(f.key).then(function (res) { return res ? res.blob() : null; }).then(function (blob) {
            return blob ? new File([blob], f.name, { type: f.type || blob.type }) : null;
          });
        })).then(function (files) {
          files = files.filter(Boolean);
          if (files.length) addFiles(files);
          el("input").focus();
        });
      })
      .catch(function (err) { setStatus("Partage illisible : " + err.message, true); })
      .then(function () { return caches.delete("mado-share-v1"); });
  }
})();
</script>
</body>
