  .msg-docs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .doc-chip { background: rgba(255,255,255,0.15); border-radius: 8px; padding: 3px 8px; font-size: 12px; }
  .msg-tools { margin-top: 6px; }
  .speak-btn { background: none; border: 0; color: #8b93a5; cursor: pointer; font-size: 14px; padding: 2px 4px; }
  .speak-btn:hover { color: #e6e9ef; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <span class="brand">MaDo</span>
      <button id="btn-new" type="button">+ Nouveau fil</button>
      <button id="btn-close-side" type="button" title="Fermer" aria-label="Fermer la liste">✕</button>
    </div>
    <div class="side-tools">
      <input id="search" type="search" placeholder="Rechercher dans les fils…" aria-label="Rechercher dans les fils" autocomplete="off">
      <div class="project-row">
        <select id="project" aria-label="Projet"></select>
        <button id="btn-project-edit" type="button" class="mini" title="Instructions du projet" hidden>⚙</button>
      </div>
    </div>
    <nav id="threads"></nav>
    <div class="side-foot">
      <div class="foot-tools">
        <button id="btn-memory" type="button" class="mini" title="Ce que MaDo retient sur vous">🧠</button>
        <button id="btn-tasks" type="button" class="mini" title="Rappels et tâches programmées">⏰</button>
        <button id="btn-costs" type="button" class="mini" title="Coûts">💶</button>
        <button id="btn-diag" type="button" class="mini" title="Diagnostic">🩺</button>
        <button id="btn-settings" type="button" class="mini" title="Clé API">🔑</button>
      </div>
      <span id="health" class="muted"></span>
    </div>
  </aside>
  <div id="backdrop" hidden></div>
  <main id="main">
    <header id="chat-head">
      <button id="btn-menu" type="button" title="Fils de discussion" aria-label="Afficher les fils de discussion">☰</button>
      <span id="chat-title" class="untitled">MaDo</span>
      <button id="btn-move" type="button" class="head-btn" title="Ranger dans un projet" hidden>📁</button>
      <button id="btn-export" type="button" class="head-btn" title="Exporter ce fil" hidden>⤓</button>
      <button id="btn-new-top" type="button" title="Nouveau fil" aria-label="Nouveau fil">＋</button>
    </header>
    <div id="empty">
      <div class="big">MaDo</div>
      <div>Créez un fil ou choisissez-en un dans la liste.</div>
    </div>
    <div id="chat" hidden>
      <div id="messages"></div>
      <div id="statusline" hidden></div>
      <div id="pending" hidden></div>
      <form id="composer">
        <input id="file-attach" type="file" accept="image/*" multiple hidden>
        <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
        <input id="file-audio" type="file" accept="audio/*" capture hidden>
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Écrivez à MaDo…"></textarea>
          <div class="composer-bar">
            <div class="bar-left">
              <button id="btn-attach" class="icon-btn" type="button" title="Joindre une image ou un fichier" aria-label="Joindre">📎</button>

                  <option value="">Auto</option>
                  <option value="none">Aucune</option>
                  <option value="low">Faible</option>

</div>
<div id="camera" hidden>
  <video id="cam-video" autoplay playsinline muted></video>
  <div class="cam-bar">
    <button id="cam-cancel" class="cam-side" type="button">Annuler</button>
    <button id="cam-shoot" type="button" title="Prendre la photo" aria-label="Prendre la photo"></button>
    <button id="cam-flip" class="cam-side" type="button" title="Changer de caméra">⟲</button>

<div id="panel-modal" class="modal" hidden>
  <div class="box wide">
    <div class="modal-head"><h2 id="pm-title"></h2><button type="button" id="pm-close" class="mini" title="Fermer">✕</button></div>
    <div id="pm-body"></div>
  </div>
</div>
<div id="settings" class="modal" hidden>
  <div class="box">
    <h2>Clé API</h2>
    <p class="muted">Seulement pour l'application installée (MaDo ouvert hors de Home Assistant, derrière votre propre proxy). Dans Home Assistant, le panneau est déjà protégé par la connexion HA.</p>
    <input id="token" type="password" autocomplete="off">
    <div id="app-token" hidden>
      <p class="muted">La clé à coller dans l'application installée :</p>
      <div class="row"><code id="app-token-value"></code><button type="button" class="cancel" id="btn-copy-token">Copier</button></div>
    </div>
    <div class="row">
      <button type="button" class="cancel" id="btn-cancel">Annuler</button>
      <button type="button" class="save" id="btn-save">Enregistrer</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  // The panel talks to the same server that serves this page, under one
  // user id for every thread. Each "mado-thread:" id is a sealed world on
  // the server: its own history, its own long-term memory and its own
  // recall, with nothing from Assist or the other threads, and nothing
  // learned here reaching them (memory/memory-scope.ts).
  var USER_ID = "default";
  var THREAD_PREFIX = "mado-thread:";
  var LS_TOKEN = "mado_api_token";

  var el = function (id) { return document.getElementById(id); };
  var state = { current: null, threads: [], busy: false };

  function authHeaders() {
    var h = {};
    var token = localStorage.getItem(LS_TOKEN);
    if (token) h["Authorization"] = "Bearer " + token;
    return h;
  }

  function headers() {
    return Object.assign({ "Content-Type": "application/json" }, authHeaders());
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign(headers(), opts.headers || {});
    return fetch(path, opts).then(function (res) {
      if (res.ok) return res;
      var status = res.status;
      return res.text().then(function (text) {
        var err = new Error("HTTP " + status + " " + (text || "").slice(0, 200));
        err.status = status;
        throw err;
      });
    });
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  // ----- sidebar -----

  function loadThreads() {
    return api("api/conversations/" + USER_ID)
      .then(function (res) { return res.json(); })
      .then(function (list) {
        return (Array.isArray(list) ? list : []).filter(function (c) {
          return typeof c.conversationId === "string" && c.conversationId.indexOf(THREAD_PREFIX) === 0;
        });
      });
  }

  // Favourites (★) first, under their own heading; then the rest, newest first.
  function renderThreads(threads) {
    var nav = el("threads");
    nav.textContent = "";
    if (state.projectFilter) threads = threads.filter(function (t) { return t.projectId === state.projectFilter; });
    if (state.searching && el("search").value.trim().length >= 2) return;
    var pinned = threads.filter(function (t) { return t.pinned; });
    var others = threads.filter(function (t) { return !t.pinned; });
    function heading(text) {
      var h = document.createElement("div");
      h.className = "t-section";
      h.textContent = text;
      nav.appendChild(h);
    }
    if (pinned.length) heading("★ Favoris");
    pinned.forEach(threadRow);
    if (pinned.length && others.length) heading("Récents");
    others.forEach(threadRow);
    if (!threads.length) {
      var hint = document.createElement("div");
      hint.className = "muted";
      hint.style.padding = "10px";
      hint.textContent = state.projectFilter ? "Aucun fil dans ce projet." : "Aucun fil pour le moment.";
      nav.appendChild(hint);
    }
    if (el("btn-send")) refreshSendButton();
  }

  function threadRow(t) {
      var nav = el("threads");
      var row = document.createElement("div");
      row.className = "thread" + (t.conversationId === state.current ? " active" : "") + (t.pinned ? " pinned" : "") +
        (isRunning(t.conversationId) ? " running" : "");
      var main = document.createElement("div");
      main.className = "t-main";
      var title = document.createElement("div");
      title.className = "t-title";
      if (isRunning(t.conversationId)) {
        var dots = document.createElement("span");
        dots.className = "t-busy";
        dots.title = "MaDo réfléchit…";
        dots.setAttribute("aria-label", "MaDo réfléchit");
        for (var d = 0; d < 3; d++) dots.appendChild(document.createElement("i"));
        title.appendChild(dots);
      }
      title.appendChild(document.createTextNode(t.title || "Sans titre"));
      var date = document.createElement("div");
      date.className = "t-date";
      try { date.textContent = new Date(t.lastMessageAt).toLocaleString(); } catch (e) { date.textContent = ""; }
      main.appendChild(title);
      main.appendChild(date);
      var star = document.createElement("button");
      star.className = "t-star"; star.type = "button"; star.textContent = t.pinned ? "★" : "☆";
      star.title = t.pinned ? "Retirer des favoris" : "Ajouter aux favoris";
      star.setAttribute("aria-pressed", t.pinned ? "true" : "false");
      star.addEventListener("click", function (ev) {
        ev.stopPropagation();
        togglePin(t);
      });
      var edit = document.createElement("button");
      edit.className = "t-edit"; edit.type = "button"; edit.textContent = "✎";
      edit.title = "Renommer ce fil";
      edit.addEventListener("click", function (ev) {
        ev.stopPropagation();
        startRename(t.conversationId, title);
      });
      var del = document.createElement("button");
      del.className = "t-del"; del.type = "button"; del.textContent = "✕";
      del.title = "Supprimer ce fil";
      del.addEventListener("click", function (ev) {
        ev.stopPropagation();
        deleteThread(t.conversationId);
      });
      row.appendChild(main);
      row.appendChild(star);
      row.appendChild(edit);
      row.appendChild(del);
      row.addEventListener("click", function () { openThread(t.conversationId); });
      nav.appendChild(row);
  }

  function togglePin(t) {
    var want = !t.pinned;
    t.pinned = want;
    renderThreads(state.threads);
    api("api/conversations/" + USER_ID + "/" + encodeURIComponent(t.conversationId), {
      method: "PATCH",
      body: JSON.stringify({ pinned: want })
    }).catch(function (err) {
      t.pinned = !want;
      renderThreads(state.threads);
      setStatus("Favori non enregistré : " + err.message, true);
    });
  }

  function refreshThreads() {
    return loadThreads()
      .then(function (list) { state.threads = list; renderThreads(list); })
      .catch(showListError);
  }

  function showListError(err) {
    var nav = el("threads");
    nav.textContent = "";
    var hint = document.createElement("div");
    hint.className = "muted";
    hint.style.padding = "10px";
    hint.style.color = "#ff6b6b";
    hint.textContent = "Liste indisponible : " + err.message;
    nav.appendChild(hint);
    if (err.status === 401 || err.status === 403) openSettings();
  }

  // Inline rename: the title turns into a field; Enter or leaving it saves,
  // Escape cancels. A thread can only be named once it has a message, since
  // the server keeps names for conversations it knows.
  function startRename(id, titleEl) {
    if (titleEl.querySelector("input")) return;
    var known = state.threads.filter(function (t) { return t.conversationId === id; })[0];
    if (!known) return;
    var before = known.title || "";
    var field = document.createElement("input");
    field.className = "rename";
    field.maxLength = 120;
    field.value = before;
    titleEl.textContent = "";
    titleEl.appendChild(field);
    field.addEventListener("click", function (ev) { ev.stopPropagation(); });
    field.focus();
    field.select();
    var done = false;
    function finish(save) {
      if (done) return;
      done = true;
      var value = field.value.replace(/\s+/g, " ").trim();
      if (!save || !value || value === before) {
        titleEl.textContent = before || "Sans titre";
        return;
      }
      titleEl.textContent = value;
      api("api/conversations/" + USER_ID + "/" + encodeURIComponent(id), {
        method: "PATCH",
        body: JSON.stringify({ title: value })
      })
        .then(function () {
          known.title = value;
          if (state.current === id) el("chat-title").textContent = value;
          return refreshThreads();
        })
        .catch(function (err) {
          titleEl.textContent = before || "Sans titre";
          setStatus("Renommage impossible : " + err.message, true);
        });
    }
    field.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
      else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
    });
    field.addEventListener("blur", function () { finish(true); });
  }

  el("chat-title").addEventListener("click", function () {
    var known = state.threads.filter(function (t) { return t.conversationId === state.current; })[0];
    if (known) startRename(state.current, el("chat-title"));
  });

  function deleteThread(id) {
    if (!window.confirm("Supprimer ce fil ? Ses messages seront perdus.")) return;
    api("api/conversations/" + USER_ID + "/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function () {
        if (state.current === id) newThread();
        return refreshThreads();
      })
      .catch(function (err) { setStatus(err.message, true); });
  }

  // ----- chat -----

  function openThread(id, quiet) {
    state.current = id;
    showPick();
    state.liveFor = null;
    state.editFrom = null;
    el("btn-export").hidden = false;
    el("btn-move").hidden = !state.projects.length;
    el("chat").hidden = false;
    el("empty").hidden = true;
    var known = state.threads.filter(function (t) { return t.conversationId === id; })[0];
    el("chat-title").textContent = (known && known.title) || "Fil";
    el("chat-title").classList.remove("untitled");
    if (!quiet) { el("messages").textContent = ""; setStatus(""); closeSide(); }
    refreshSendButton();
    api("api/conversations/" + USER_ID + "/" + encodeURIComponent(id))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (state.current !== id) return;
        var messages = (data && data.messages) || [];
        el("messages").textContent = "";
        messages.forEach(function (m) {
          var box = addBubble(m.role, m.content);
          if (m.id) box.dataset.id = m.id;
        });
        decorateLast(messages);
        scrollDown();
        // A reply still being written (asked from another page, or before
        // the panel was left) is followed until it is stored.
        if (state.current === id && isRunning(id)) follow(id);
        syncRunning();
      })
      .catch(function (err) { addBubble("assistant", "Historique indisponible : " + err.message); });
  }

  function newThread() {
    state.current = THREAD_PREFIX + uuid();
    showPick();
    state.liveFor = null;
    state.editFrom = null;
    el("btn-export").hidden = true;
    el("btn-move").hidden = true;
    // A thread started inside a project belongs to it.
    if (state.projectFilter) assignProject(state.current, state.projectFilter).catch(function () {});
    el("chat").hidden = false;
    el("empty").hidden = true;
    el("chat-title").textContent = "Nouveau fil";
    el("chat-title").classList.add("untitled");
    el("messages").textContent = "";
    setStatus("");
    closeSide();
    el("input").focus();
  }

  function addBubble(role, text, images) {
    var box = document.createElement("div");
    box.className = "msg " + (role === "user" ? "user" : "assistant");
    box.dataset.text = text || "";
    renderInto(box, role, text);
    if (role !== "user" && text) addSpeak(box);
    if (images && images.length) {
      var strip = document.createElement("div");
      strip.className = "msg-images";
      images.forEach(function (src) {
        var img = document.createElement("img");
        img.src = src;
        img.alt = "Image envoyée";
        img.addEventListener("click", function () { window.open(src, "_blank"); });
        strip.appendChild(img);
      });
      box.insertBefore(strip, box.firstChild);
    }
    el("messages").appendChild(box);
    return box;
  }

  // ----- message rendering -----
  //
  // Assistant replies are Markdown: headings, lists, tables, quotes, links,
  // images the tools produced, ``` code blocks with a copy button, and
  // ```chart blocks drawn as SVG charts. Everything is built with DOM nodes
  // and textContent, never innerHTML, so a reply can never inject markup.
  // A fence still open at the end (mid-stream) renders as code too.

  var FENCE = /```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g;
  var DOC_BLOCK = /<document name="([^"]*)">[\s\S]*?(?:<\/document>|$)/g;

  function renderInto(box, role, text) {
    box.textContent = "";
    if (role === "user") { renderUser(box, text); return; }
    var last = 0;
    var match;
    FENCE.lastIndex = 0;
    while ((match = FENCE.exec(text)) !== null) {
      if (match[0] === "") { FENCE.lastIndex++; continue; }
      renderMarkdown(box, text.slice(last, match.index));
      var lang = match[1].trim().toLowerCase();
      var body = match[2].replace(/\n$/, "");
      var closed = /```$/.test(match[0]);
      if (lang === "chart") box.appendChild(chartOrCode(body, closed));
      else box.appendChild(codeBlock(match[1].trim(), body));
      last = match.index + match[0].length;
    }
    renderMarkdown(box, text.slice(last));
  }

  // A user message shows its attached PDFs as chips, not their whole text.
  function renderUser(box, text) {
    var docs = [];
    var shown = text.replace(DOC_BLOCK, function (_m, name) { docs.push(name); return ""; }).trim();
    box.appendChild(document.createTextNode(shown));
    if (docs.length) {
      var strip = document.createElement("div");
      strip.className = "msg-docs";
      docs.forEach(function (name) {
        var chip = document.createElement("span");
        chip.className = "doc-chip";
        chip.textContent = "📄 " + name;
        strip.appendChild(chip);
      });
      box.appendChild(strip);
    }
  }

  var TABLE_RULE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  var LIST_ITEM = /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/;

  function splitRow(line) {
    var t = line.trim();
    if (t.charAt(0) === "|") t = t.slice(1);
    if (t.charAt(t.length - 1) === "|") t = t.slice(0, -1);
    return t.split("|").map(function (c) { return c.trim(); });
  }

  function renderMarkdown(box, text) {
    if (!text || !text.trim()) return;
    var lines = text.replace(/\r/g, "").split("\n");
    var para = [];
    function flush() {
      if (!para.length) return;
      var p = document.createElement("p");
      para.forEach(function (l, i) {
        if (i) p.appendChild(document.createElement("br"));
        inline(p, l);
      });
      box.appendChild(p);
      para = [];
    }
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (!line.trim()) { flush(); i++; continue; }
      if (h) {
        flush();
        var level = Math.min(6, h[1].length + 2);
        var head = document.createElement("h" + level);
        inline(head, h[2].replace(/\s+#+\s*$/, ""));
        box.appendChild(head);
        i++; continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); box.appendChild(document.createElement("hr")); i++; continue; }
      if (line.indexOf("|") !== -1 && i + 1 < lines.length && TABLE_RULE.test(lines[i + 1])) {
        flush();
        var rows = [splitRow(line)];
        var aligns = splitRow(lines[i + 1]).map(function (c) {
          return /^:-+:$/.test(c) ? "center" : /-+:$/.test(c) ? "right" : "";
        });
        i += 2;
        while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim()) { rows.push(splitRow(lines[i])); i++; }
        box.appendChild(expandableTable(rows, aligns));
        continue;
      }
      if (/^\s*>/.test(line)) {
        flush();
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        var bq = document.createElement("blockquote");
        renderMarkdown(bq, quote.join("\n"));
        box.appendChild(bq);
        continue;
      }
      if (LIST_ITEM.test(line)) {
        flush();
        var items = [];
        while (i < lines.length) {
          var m = LIST_ITEM.exec(lines[i]);
          if (m) { items.push({ indent: m[1].replace(/\t/g, "  ").length, ordered: /\d/.test(m[2]), start: parseInt(m[2], 10), text: m[3] }); i++; continue; }
          // An indented line continues the item above it.
          if (items.length && /^\s{2,}\S/.test(lines[i])) { items[items.length - 1].text += "\n" + lines[i].trim(); i++; continue; }
          break;
        }
        box.appendChild(list(items));
        continue;
      }
      para.push(line);
      i++;
    }
    flush();
  }

  function list(items) {
    var root = null;
    var stack = [];
    items.forEach(function (it) {
      while (stack.length && it.indent < stack[stack.length - 1].indent) stack.pop();
      var top = stack[stack.length - 1];
      if (!top || it.indent > top.indent) {
        var l = document.createElement(it.ordered ? "ol" : "ul");
        if (it.ordered && it.start > 1) l.start = it.start;
        if (top && top.list.lastChild) top.list.lastChild.appendChild(l);
        else if (!root) root = l;
        else root.appendChild(l);
        stack.push({ indent: it.indent, list: l });
        top = stack[stack.length - 1];
      }
      var li = document.createElement("li");
      it.text.split("\n").forEach(function (part, n) {
        if (n) li.appendChild(document.createElement("br"));
        inline(li, part);
      });
      top.list.appendChild(li);
    });
    return root || document.createElement("ul");
  }

  // ----- full screen -----
  //
  // Charts and tables of a reply open full screen with ⛶: the chart is drawn
  // again at the size of the screen (its SVG scales), a table gets the whole
  // width. ✕, Échap or a tap outside closes it.

  function expandButton(fn) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "expand-btn";
    b.textContent = "⛶";
    b.title = "Agrandir";
    b.setAttribute("aria-label", "Afficher en grand");
    b.addEventListener("click", function (ev) { ev.stopPropagation(); fn(); });
    return b;
  }

  function expandableTable(rows, aligns) {
    var box = document.createElement("div");
    box.className = "table-box";
    box.appendChild(table(rows, aligns));
    box.appendChild(expandButton(function () {
      openFullscreen("Tableau", function () { return table(rows, aligns); });
    }));
    return box;
  }

  var fsResize = null;
  function closeFullscreen() {
    var fs = el("fullscreen");
    if (!fs) return;
    fs.parentNode.removeChild(fs);
    document.removeEventListener("keydown", fullscreenKey);
    if (fsResize) window.removeEventListener("resize", fsResize);
    fsResize = null;
  }

  function fullscreenKey(ev) { if (ev.key === "Escape") closeFullscreen(); }

  // build() makes the content; it runs again when the screen turns, so a
  // chart is redrawn to the new size.
  function openFullscreen(title, build) {
    closeFullscreen();
    var fs = document.createElement("div");
    fs.id = "fullscreen";
    fs.setAttribute("role", "dialog");
    fs.setAttribute("aria-label", title);
    var head = document.createElement("div");
    head.className = "fs-head";
    var t = document.createElement("span");
    t.textContent = title;
    var close = document.createElement("button");
    close.type = "button";
    close.className = "fs-close";
    close.textContent = "✕";
    close.title = "Fermer (Échap)";
    close.addEventListener("click", closeFullscreen);
    head.appendChild(t);
    head.appendChild(close);
    var body = document.createElement("div");
    body.className = "fs-body";
    body.appendChild(build());
    var resizeTimer = null;
    fsResize = function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { body.textContent = ""; body.appendChild(build()); }, 150);
    };
    window.addEventListener("resize", fsResize);
    body.addEventListener("click", function (ev) { if (ev.target === body) closeFullscreen(); });
    fs.appendChild(head);
    fs.appendChild(body);
    document.body.appendChild(fs);
    document.addEventListener("keydown", fullscreenKey);
    close.focus();
  }

  function table(rows, aligns) {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    var t = document.createElement("table");
    rows.forEach(function (cells, r) {
      var tr = document.createElement("tr");
      cells.forEach(function (c, ci) {
        var cell = document.createElement(r === 0 ? "th" : "td");
        if (aligns[ci]) cell.style.textAlign = aligns[ci];
        inline(cell, c);
        tr.appendChild(cell);
      });
      (r === 0 ? (t.tHead || t.createTHead()) : (t.tBodies[0] || t.createTBody())).appendChild(tr);
    });
    wrap.appendChild(t);
    return wrap;
  }

  // Inline Markdown. Links open outside the panel and only for http(s) and
  // mailto; images only for files MaDo's own tools produced.
  var INLINE = /(`[^`\n]+`)|(!\[([^\]\n]*)\]\(([^)\s]+)\))|(\[([^\]\n]+)\]\(([^)\s]+)\))|(\*\*([^*\n]+)\*\*)|(__([^_\n]+)__)|(~~([^~\n]+)~~)|(\*([^*\s][^*\n]*)\*)|(\b_([^_\n]+)_\b)|(https?:\/\/[^\s<>()\]]+[^\s<>()\].,;:!?'"])/;
  var MEDIA_SRC = /^api\/media\/[0-9a-f-]{36}$/;

  function inline(parent, text) {
    var rest = text;
    while (rest) {
      var m = INLINE.exec(rest);
      if (!m) { parent.appendChild(document.createTextNode(rest)); return; }
      if (m.index) parent.appendChild(document.createTextNode(rest.slice(0, m.index)));
      if (m[1]) {
        var c = document.createElement("code");
        c.className = "inline-code";
        c.textContent = m[1].slice(1, -1);
        parent.appendChild(c);
      } else if (m[2]) {
        if (MEDIA_SRC.test(m[4])) parent.appendChild(mediaImage(m[4], m[3]));
        else parent.appendChild(link(m[4], m[3] || m[4]));
      } else if (m[5]) {
        parent.appendChild(link(m[7], m[6]));
      } else if (m[8] || m[10]) {
        var b = document.createElement("strong");
        inline(b, m[9] || m[11]);
        parent.appendChild(b);
      } else if (m[12]) {
        var s = document.createElement("s");
        inline(s, m[13]);
        parent.appendChild(s);
      } else if (m[14] || m[16]) {
        var em = document.createElement("em");
        inline(em, m[15] || m[17]);
        parent.appendChild(em);
      } else if (m[18]) {
        parent.appendChild(link(m[18], m[18]));
      }
      rest = rest.slice(m.index + m[0].length);
    }
  }

  function link(href, label) {
    if (MEDIA_SRC.test(href)) {
      var dl = document.createElement("a");
      dl.href = "#";
      dl.textContent = label;
      dl.className = "file-link";
      // A file MaDo made: downloaded under its own name.
      dl.addEventListener("click", function (ev) {
        ev.preventDefault();
        mediaUrl(href).then(function (url) {
          var a = document.createElement("a");
          a.href = url;
          a.download = String(label).replace(/^📎\s*/, "").replace(/[\\/:*?"<>|]/g, "") || "fichier";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, function () { setStatus("Fichier indisponible.", true); });
      });
      return dl;
    }
    if (!/^(https?:\/\/|mailto:)/i.test(href)) return document.createTextNode(label);
    var a = document.createElement("a");
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = label;
    return a;
  }

  // Tool files are fetched with the panel's own auth and shown as blob URLs;
  // a reply is re-rendered on every streamed chunk, so each is fetched once.
  var mediaCache = {};
  function mediaUrl(src) {
    if (!mediaCache[src]) {
      mediaCache[src] = fetch(src, { headers: authHeaders() }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.blob();
      }).then(function (blob) { return URL.createObjectURL(blob); });
      mediaCache[src].catch(function () { delete mediaCache[src]; });
    }
    return mediaCache[src];
  }

  function mediaImage(src, alt) {
    var img = document.createElement("img");
    img.className = "md-img";
    img.alt = alt || "image";
    mediaUrl(src).then(function (url) {
      img.src = url;
      img.addEventListener("click", function () { window.open(url, "_blank"); });
    }, function () { img.alt = "Image indisponible"; img.className = "md-img broken"; });
    return img;
  }

  // ----- charts -----
  //
  // A ```chart block holds {type, title, unit, labels, series:[{name, data}]}.
  // Colours: a fixed categorical order validated for colour-blind separation
  // and 3:1 contrast on the bubble background (#232733); a series keeps its
  // colour whatever else is shown. Two or more series get a legend, every
  // mark a tooltip, and the chart a table view.

  var SERIES_COLORS = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#9085e9"];
  var SVG_NS = "http://www.w3.org/2000/svg";

  function svgEl(name, attrs, parent) {
    var n = document.createElementNS(SVG_NS, name);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(n);
    return n;
  }

  function chartOrCode(body, closed) {
    var spec = null;
    try { spec = normalizeChart(JSON.parse(body)); } catch (e) { spec = null; }
    if (spec) return chartBlock(spec);
    if (!closed) {
      var wait = document.createElement("div");
      wait.className = "chart chart-wait";
      wait.textContent = "Graphique en préparation…";
      return wait;
    }
    return codeBlock("chart", body);
  }

  function normalizeChart(raw) {
    if (!raw || typeof raw !== "object") return null;
    var type = raw.type === "bar" || raw.type === "pie" ? raw.type : "line";
    var labels = Array.isArray(raw.labels) ? raw.labels.slice(0, 200).map(String) : [];
    var series = (Array.isArray(raw.series) ? raw.series : []).slice(0, 6).map(function (s, i) {
      var data = (Array.isArray(s && s.data) ? s.data : []).slice(0, labels.length || 200).map(function (v) {
        var n = typeof v === "number" ? v : parseFloat(v);
        return isFinite(n) ? n : null;
      });
      return { name: String((s && s.name) || "Série " + (i + 1)), data: data, color: SERIES_COLORS[i] };
    }).filter(function (s) { return s.data.some(function (v) { return v !== null; }); });
    if (!series.length) return null;
    if (!labels.length) labels = series[0].data.map(function (_v, i) { return String(i + 1); });
    if (type === "pie") {
      // Six slices at most, so no colour repeats: the rest fold into "Autres".
      series = series.slice(0, 1);
      if (labels.length > 6) {
        var d = series[0].data;
        var other = d.slice(5).reduce(function (a, v) { return a + (v || 0); }, 0);
        labels = labels.slice(0, 5).concat(["Autres"]);
        series[0].data = d.slice(0, 5).concat([other]);
      }
    }
    return { type: type, title: raw.title ? String(raw.title) : "", unit: raw.unit ? String(raw.unit) : "", labels: labels, series: series };
  }

  function fmt(v, unit) {
    if (v === null || v === undefined) return "—";
    var abs = Math.abs(v);
    // Small values (a cost of 0,0042 $) keep enough digits to differ.
    var digits = abs >= 100 ? 0 : abs >= 1 ? 2 : abs >= 0.01 ? 3 : 4;
    var s = abs >= 1000 ? Math.round(v).toLocaleString("fr-FR") : String(Math.round(v * Math.pow(10, digits)) / Math.pow(10, digits)).replace(".", ",");
    return unit ? s + " " + unit : s;
  }

  function niceTicks(min, max, count) {
    if (min === max) { min -= 1; max += 1; }
    var span = max - min;
    var step = Math.pow(10, Math.floor(Math.log10(span / count)));
    var err = span / count / step;
    step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
    var lo = Math.floor(min / step) * step;
    var hi = Math.ceil(max / step) * step;
    var ticks = [];
    for (var v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return ticks;
  }

  function chartBlock(spec, big) {
    var wrap = document.createElement("figure");
    wrap.className = "chart" + (big ? " big" : "");
    var head = document.createElement("figcaption");
    head.className = "chart-head";
    var title = document.createElement("span");
    title.className = "chart-title";
    title.textContent = spec.title || "Graphique";
    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "code-copy";
    toggle.textContent = "Tableau";
    head.appendChild(title);
    var tools = document.createElement("span");
    tools.className = "chart-tools";
    if (!big) {
      tools.appendChild(expandButton(function () {
        openFullscreen(spec.title || "Graphique", function () { return chartBlock(spec, true); });
      }));
    }
    tools.appendChild(toggle);
    head.appendChild(tools);
    wrap.appendChild(head);

    if (spec.series.length > 1 || spec.type === "pie") wrap.appendChild(legend(spec));
    // Full screen: the room left once the header, title and legend are drawn.
    var dims = big ? { w: Math.min(window.innerWidth, 1400) - 64, h: window.innerHeight - 190 } : null;
    var plot = spec.type === "pie" ? pieChart(spec) : xyChart(spec, dims);
    wrap.appendChild(plot);
    var tbl = dataTable(spec);
    tbl.hidden = true;
    wrap.appendChild(tbl);
    toggle.addEventListener("click", function () {
      tbl.hidden = !tbl.hidden;
      plot.style.display = tbl.hidden ? "" : "none";
      toggle.textContent = tbl.hidden ? "Tableau" : "Graphique";
    });
    return wrap;
  }

  function legend(spec) {
    var box = document.createElement("div");
    box.className = "chart-legend";
    var entries = spec.type === "pie"
      ? spec.labels.map(function (l, i) { return { name: l, color: SERIES_COLORS[i % SERIES_COLORS.length] }; })
      : spec.series;
    entries.forEach(function (e) {
      var item = document.createElement("span");
      var sw = document.createElement("i");
      sw.style.background = e.color;
      item.appendChild(sw);
      item.appendChild(document.createTextNode(e.name));
      box.appendChild(item);
    });
    return box;
  }

  function dataTable(spec) {
    var rows = [[""].concat(spec.series.map(function (s) { return s.name; }))];
    spec.labels.forEach(function (l, i) {
      rows.push([l].concat(spec.series.map(function (s) { return fmt(s.data[i], spec.unit); })));
    });
    return table(rows, ["", "right", "right", "right", "right", "right", "right"]);
  }

  function tooltip(node, text) { svgEl("title", {}, node).textContent = text; }

  // dims: the pixel size to draw at (full screen), so text keeps its real
  // size and a phone in portrait gets a tall chart rather than a tiny one.
  function xyChart(spec, dims) {
    var W = dims ? Math.max(300, Math.round(dims.w)) : 640, H = dims ? Math.max(260, Math.round(dims.h)) : 310, L = 52, R = 14, T = 24, B = 44;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": spec.title || "Graphique" });
    var values = [];
    spec.series.forEach(function (s) { s.data.forEach(function (v) { if (v !== null) values.push(v); }); });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (spec.type === "bar") { min = Math.min(0, min); max = Math.max(0, max); }
    var ticks = niceTicks(min, max, 5);
    var lo = ticks[0], hi = ticks[ticks.length - 1];
    var n = spec.labels.length;
    var pw = W - L - R, ph = H - T - B;
    var y = function (v) { return T + ph - (v - lo) / (hi - lo) * ph; };
    var band = pw / n;
    var x = spec.type === "bar"
      ? function (i) { return L + band * i + band / 2; }
      : function (i) { return n === 1 ? L + pw / 2 : L + pw * i / (n - 1); };

    ticks.forEach(function (t) {
      svgEl("line", { x1: L, x2: W - R, y1: y(t), y2: y(t), class: t === 0 && lo < 0 ? "axis" : "grid" }, svg);
      var lbl = svgEl("text", { x: L - 8, y: y(t) + 4, "text-anchor": "end", class: "tick" }, svg);
      lbl.textContent = fmt(t);
    });
    if (spec.unit) {
      var u = svgEl("text", { x: 4, y: 10, "text-anchor": "start", class: "tick" }, svg);
      u.textContent = spec.unit;
    }
    var every = Math.max(1, Math.ceil(n / Math.max(4, Math.floor((W - L - R) / 72))));
    spec.labels.forEach(function (l, i) {
      if (i % every && i !== n - 1) return;
      if (i === n - 1 && i % every && n - 1 - Math.floor((n - 1) / every) * every < every / 2) return;
      var t = svgEl("text", { x: x(i), y: H - B + 18, "text-anchor": "middle", class: "tick" }, svg);
      t.textContent = l.length > 12 ? l.slice(0, 11) + "…" : l;
    });
    svgEl("line", { x1: L, x2: W - R, y1: y(Math.max(lo, Math.min(0, hi))), y2: y(Math.max(lo, Math.min(0, hi))), class: "axis" }, svg);

    if (spec.type === "bar") {
      var k = spec.series.length;
      var gap = 2;
      var bw = Math.max(2, Math.min(36, (band * 0.75 - gap * (k - 1)) / k));
      var zero = y(Math.max(lo, Math.min(0, hi)));
      spec.series.forEach(function (s, si) {
        s.data.forEach(function (v, i) {
          if (v === null) return;
          var bx = x(i) - (bw * k + gap * (k - 1)) / 2 + si * (bw + gap);
          var top = Math.min(y(v), zero), h = Math.max(1, Math.abs(y(v) - zero));
          var r = Math.min(4, bw / 2, h);
          var up = v >= 0;
          // Rounded at the data end only, square on the baseline.
          var d = up
            ? "M" + bx + "," + (top + h) + "V" + (top + r) + "Q" + bx + "," + top + " " + (bx + r) + "," + top + "H" + (bx + bw - r) + "Q" + (bx + bw) + "," + top + " " + (bx + bw) + "," + (top + r) + "V" + (top + h) + "Z"
            : "M" + bx + "," + top + "V" + (top + h - r) + "Q" + bx + "," + (top + h) + " " + (bx + r) + "," + (top + h) + "H" + (bx + bw - r) + "Q" + (bx + bw) + "," + (top + h) + " " + (bx + bw) + "," + (top + h - r) + "V" + top + "Z";
          var bar = svgEl("path", { d: d, fill: s.color, class: "mark" }, svg);
          tooltip(bar, spec.labels[i] + " · " + s.name + " : " + fmt(v, spec.unit));
        });
      });
    } else {
      spec.series.forEach(function (s) {
        var d = "";
        var pen = false;
        s.data.forEach(function (v, i) {
          if (v === null) { pen = false; return; }
          d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1);
          pen = true;
        });
        svgEl("path", { d: d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
        if (n <= 40) {
          s.data.forEach(function (v, i) {
            if (v === null) return;
            svgEl("circle", { cx: x(i), cy: y(v), r: 4, fill: s.color, class: "dot" }, svg);
          });
        }
      });
      // One hover column per label: crosshair + every series' value.
      spec.labels.forEach(function (l, i) {
        var hit = svgEl("rect", { x: x(i) - Math.max(pw / Math.max(n - 1, 1) / 2, 4), y: T, width: Math.max(pw / Math.max(n - 1, 1), 8), height: ph, class: "hit" }, svg);
        svgEl("line", { x1: x(i), x2: x(i), y1: T, y2: T + ph, class: "cross" }, svg);
        tooltip(hit, l + "\n" + spec.series.map(function (s) { return s.name + " : " + fmt(s.data[i], spec.unit); }).join("\n"));
      });
    }
    return svg;
  }

  function pieChart(spec) {
    var s = spec.series[0];
    var svg = svgEl("svg", { viewBox: "0 0 300 220", role: "img", "aria-label": spec.title || "Graphique", class: "pie" });
    var vals = s.data.map(function (v) { return v && v > 0 ? v : 0; });
    var total = vals.reduce(function (a, b) { return a + b; }, 0) || 1;
    var cx = 150, cy = 110, r = 96, ri = 56;
    var a0 = -Math.PI / 2;
    vals.forEach(function (v, i) {
      if (!v) return;
      var a1 = a0 + v / total * Math.PI * 2;
      var large = a1 - a0 > Math.PI ? 1 : 0;
      var p = function (rad, a) { return (cx + rad * Math.cos(a)).toFixed(2) + "," + (cy + rad * Math.sin(a)).toFixed(2); };
      var d = v === total
        ? "M" + p(r, 0) + "A" + r + "," + r + " 0 1 1 " + p(r, Math.PI) + "A" + r + "," + r + " 0 1 1 " + p(r, 0) + "M" + p(ri, 0) + "A" + ri + "," + ri + " 0 1 0 " + p(ri, Math.PI) + "A" + ri + "," + ri + " 0 1 0 " + p(ri, 0) + "Z"
        : "M" + p(r, a0) + "A" + r + "," + r + " 0 " + large + " 1 " + p(r, a1) + "L" + p(ri, a1) + "A" + ri + "," + ri + " 0 " + large + " 0 " + p(ri, a0) + "Z";
      var seg = svgEl("path", { d: d, fill: SERIES_COLORS[i % SERIES_COLORS.length], class: "mark slice", "fill-rule": "evenodd" }, svg);
      tooltip(seg, spec.labels[i] + " : " + fmt(v, spec.unit) + " (" + Math.round(v / total * 100) + " %)");
      a0 = a1;
    });
    var t = svgEl("text", { x: cx, y: cy + 5, "text-anchor": "middle", class: "pie-total" }, svg);
    t.textContent = fmt(total, spec.unit);
    return svg;
  }

  // ----- replies in progress -----
  //
  // A reply goes on on the server when the panel is left (another Home
  // Assistant page, the app in the background): only this page's stream is
  // cut. The list shows which threads are still being answered, and an open
  // thread whose reply is in progress is followed until it is stored.

  state.localRunning = {};
  state.serverRunning = {};
  state.liveFor = null;
  var syncTimer = null;

  function isRunning(id) { return Boolean(state.localRunning[id] || state.serverRunning[id]); }

  function setThreadTitle(id, title) {
    if (!title) return;
    var known = state.threads.filter(function (t) { return t.conversationId === id; })[0];
    if (known) { known.title = title; renderThreads(state.threads); }
    if (state.current === id) {
      el("chat-title").textContent = title;
      el("chat-title").classList.remove("untitled");
    }
  }

  function syncRunning() {
    clearTimeout(syncTimer);
    return api("api/running/" + USER_ID)
      .then(function (res) { return res.json(); })
      .then(function (list) {
        var before = Object.keys(state.serverRunning).sort().join("|");
        state.serverRunning = {};
        (Array.isArray(list) ? list : []).forEach(function (t) { state.serverRunning[t.conversationId] = true; });
        var after = Object.keys(state.serverRunning).sort().join("|");
        if (before !== after) refreshThreads();
        if (state.current && state.serverRunning[state.current] && state.liveFor === null) follow(state.current);
        // Poll while something runs; otherwise only on demand.
        if (after) syncTimer = setTimeout(syncRunning, 3000);
      })
      .catch(function () {});
  }

  function follow(id) {
    // Distinct from this page's own stream (state.liveFor === id), which
    // must not add bubbles to a thread that is being followed.
    var tag = "follow:" + id;
    state.liveFor = tag;
    var bubble = addBubble("assistant", "");
    bubble.classList.add("live");
    function tick() {
      if (state.current !== id || state.liveFor !== tag) { if (bubble.parentNode) bubble.parentNode.removeChild(bubble); return; }
      api("api/running/" + USER_ID + "/" + encodeURIComponent(id))
        .then(function (res) { return res.json(); })
        .then(function (live) {
          if (state.current !== id || state.liveFor !== tag) return;
          if (!live.running) {
            // Stored: show the thread as it is now.
            state.liveFor = null;
            openThread(id);
            refreshThreads();
            return;
          }
          if (live.text) {
            bubble.dataset.text = live.text;
            renderInto(bubble, "assistant", live.text);
          } else {
            bubble.textContent = live.status || "MaDo réfléchit…";
          }
          setStatus(live.status || "MaDo répond…");
          scrollDown();
          setTimeout(tick, 1500);
        })
        .catch(function () { setTimeout(tick, 4000); });
    }
    tick();
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden) syncRunning(); });
  window.addEventListener("focus", function () { syncRunning(); });

  // ----- OCR price check -----
  //
  // A PDF without text (a scan) can only be read by Mistral OCR, billed per
  // page. The server stops before reading it and sends the estimate; the
  // user decides here, and the message is sent again with the answer.

  function money(v) {
    var digits = v < 0.01 ? 4 : v < 1 ? 3 : 2;
    return v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: digits }) + " $";
  }

  function askOcr(box, q, answer) {
    box.textContent = "";
    box.classList.add("ocr-card");
    var files = (q.files || []).map(function (f) {
      return "« " + f.name + " » (" + Math.max(1, f.pages) + " page" + (f.pages > 1 ? "s" : "") + ")";
    }).join(", ");
    var p = document.createElement("p");
    p.textContent = (q.files.length > 1 ? "Ces PDF sont des scans sans texte : " : "Ce PDF est un scan sans texte : ") + files +
      ". Pour le lire, MaDo doit passer par l'OCR de Mistral, facturé à la page.";
    var cost = document.createElement("p");
    cost.className = "ocr-cost";
    cost.textContent = "Coût estimé : ≈ " + money(q.cost) + " pour " + q.pages + " page" + (q.pages > 1 ? "s" : "") +
      " (tarif indicatif " + money(q.pricePer1000Pages) + " les 1000 pages ; par exemple 10 pages ≈ " + money(q.pricePer1000Pages / 100) +
      ", 100 pages ≈ " + money(q.pricePer1000Pages / 10) + ").";
    var row = document.createElement("div");
    row.className = "ocr-actions";
    var yes = document.createElement("button");
    yes.type = "button";
    yes.className = "ocr-yes";
    yes.textContent = "Lire avec l'OCR (≈ " + money(q.cost) + ")";
    var no = document.createElement("button");
    no.type = "button";
    no.className = "ocr-no";
    no.textContent = "Envoyer sans le lire";
    function pick(choice) {
      if (state.busy) return;
      yes.disabled = no.disabled = true;
      if (box.parentNode) box.parentNode.removeChild(box);
      answer(choice);
    }
    yes.addEventListener("click", function () { pick("yes"); });
    no.addEventListener("click", function () { pick("no"); });
    row.appendChild(yes);
    row.appendChild(no);
    box.appendChild(p);
    box.appendChild(cost);
    box.appendChild(row);
    scrollDown();
  }

  // ----- read aloud -----
  //
  // 🔊 under a reply when the server has a voice (TTS). Code, charts and
  // images are not read; Markdown marks are dropped.

  var speaking = { audio: null, btn: null };

  function speakable(text) {
    return text
      .replace(/```[\s\S]*?(```|$)/g, " ")
      .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/https?:\/\/\S+/g, " ")
      .replace(/^\s*\|?\s*:?-{2,}.*$/gm, " ")
      .replace(/[*_~`#>|]/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 4000);
  }

  function stopSpeaking() {
    if (speaking.audio) { speaking.audio.pause(); speaking.audio = null; }
    if (speaking.btn) { speaking.btn.textContent = "🔊"; speaking.btn = null; }
  }

  function addSpeak(box) {
    if (!state.caps || !state.caps.tts || box.querySelector(".speak-btn")) return;
    var text = speakable(box.dataset.text || "");
    if (!text) return;
    var bar = document.createElement("div");
    bar.className = "msg-tools";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "speak-btn";
    btn.title = "Lire à voix haute";
    btn.textContent = "🔊";
    btn.addEventListener("click", function () {
      if (speaking.btn === btn) { stopSpeaking(); return; }
      stopSpeaking();
      speaking.btn = btn;
      btn.textContent = "…";
      fetch("api/tts", { method: "POST", headers: headers(), body: JSON.stringify({ text: speakable(box.dataset.text || ""), language: navigator.language }) })
        .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.blob(); })
        .then(function (blob) {
          if (speaking.btn !== btn) return;
          var url = URL.createObjectURL(blob);
          var audio = new Audio(url);
          speaking.audio = audio;
          btn.textContent = "⏹";
          audio.onended = function () { URL.revokeObjectURL(url); if (speaking.btn === btn) stopSpeaking(); };
          return audio.play();
        })
        .catch(function (err) { setStatus("Lecture impossible : " + err.message, true); if (speaking.btn === btn) stopSpeaking(); });
    });
    bar.appendChild(btn);
    box.appendChild(bar);
  }

  function codeBlock(lang, code) {
    var wrap = document.createElement("div");
    wrap.className = "code";
    var head = document.createElement("div");
    head.className = "code-head";
    var label = document.createElement("span");
    label.textContent = lang || "code";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "code-copy";
    btn.textContent = "Copier";
    btn.addEventListener("click", function () {
      copyText(code).then(function () {
        btn.textContent = "Copié ✓";
        btn.classList.add("done");
      }, function () {
        btn.textContent = "Échec";
      }).then(function () {
        setTimeout(function () { btn.textContent = "Copier"; btn.classList.remove("done"); }, 1500);
      });
    });
    head.appendChild(label);
    head.appendChild(btn);
    var pre = document.createElement("pre");
    var codeEl = document.createElement("code");
    codeEl.textContent = code;
    pre.appendChild(codeEl);
    wrap.appendChild(head);
    wrap.appendChild(pre);
    return wrap;
  }

  // The panel runs in Home Assistant's ingress iframe, where the async
  // clipboard API can be refused; the textarea + execCommand path still works.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(area);
      if (ok) resolve(); else reject(new Error("copy failed"));
    });
  }

  function scrollDown() {
    var m = el("messages");
    m.scrollTop = m.scrollHeight;
  }

  function setStatus(text, isError) {
    var s = el("statusline");
    if (!text) { s.hidden = true; s.textContent = ""; s.className = ""; return; }
    s.hidden = false;
    s.textContent = text;
    s.className = isError ? "err" : "";
  }

  // `shown` null: a resend (after the OCR question), the user's bubble is
  // already on screen. `ocr`: the answer to that question, "yes" or "no".
  function send(text, images, shown, docs, ocr) {
    state.busy = true;
    if (shown !== null) addBubble("user", shown, images);
    scrollDown();
    var ocrQuestion = null;
    var threadId = state.current;
    var listed = false;
    state.liveFor = threadId;
    state.localRunning[threadId] = true;
    renderThreads(state.threads);
    refreshSendButton();
    var bubble = addBubble("assistant", "");
    var acc = "";
    var finalResponse = null;

    function paint() { bubble.dataset.text = acc; renderInto(bubble, "assistant", acc); scrollDown(); }

    function handleBlock(block) {
      var lines = block.split("\n");
      var eventName = "message";
      var data = "";
      lines.forEach(function (line) {
        if (line.indexOf("event: ") === 0) eventName = line.slice(7).trim();
        else if (line.indexOf("data: ") === 0) data += line.slice(6);
      });
      if (!data) return;
      var payload = null;
      try { payload = JSON.parse(data); } catch (e) { return; }
      if (eventName === "chunk") {
        acc += payload.text || "";
        // The person opened another thread meanwhile: this one is followed
        // again from the server if they come back to it.
        if (state.liveFor === threadId) paint();
      }
      // The server opens every model turn with "turn", the first one too, and
      // a turn that only calls tools writes nothing. A new bubble is only
      // worth opening once the current one holds text.
      else if (eventName === "turn") {
        // The thread exists on the server now: show it, busy, in the list.
        if (!listed) { listed = true; refreshThreads(); }
        if (state.liveFor !== threadId) return;
        if (acc) { bubble = addBubble("assistant", ""); acc = ""; }
      }
      else if (eventName === "title") { setThreadTitle(threadId, payload.title); }
      else if (eventName === "status") { setStatus(payload.text || ""); }
      else if (eventName === "error") { streamError = payload.error || "Erreur"; setStatus(streamError, true); }
      else if (eventName === "done") { finalResponse = payload; }
      else if (eventName === "ocr_confirm") { ocrQuestion = payload; setStatus(""); }
    }

    var payload = {
      message: text,
      userId: USER_ID,
      conversationId: state.current,
      isVoice: false,
      language: navigator.language
    };
    if (images && images.length) payload.images = images;
    if (docs && docs.length) payload.documents = docs;
    if (ocr) payload.ocr = ocr;
    var pick = pickFor(threadId);
    // The thread keeps the choice it was answered with.
    writePick(threadId, { model: pick.model || "", reasoning: pick.reasoning || "" });
    if (pick.model) payload.model = pick.model;
    if (pick.reasoning) payload.reasoning = pick.reasoning;
    var body = JSON.stringify(payload);
    var streamError = "";

    fetch("api/chat/stream", { method: "POST", headers: headers(), body: body })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buf = "";
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) return;
            buf += decoder.decode(r.value, { stream: true });
            var blocks = buf.split("\n\n");
            buf = blocks.pop();
            blocks.forEach(handleBlock);
            return pump();
          });
        }
        return pump();
      })
      .catch(function (err) { streamError = String(err.message || err); setStatus(streamError, true); })
      .then(function () {
        delete state.localRunning[threadId];
        if (state.liveFor === threadId) state.liveFor = null;
        if (ocrQuestion) {
          askOcr(bubble, ocrQuestion, function (answer) { send(text, images, null, docs, answer); });
          state.busy = false;
          refreshSendButton();
          return;
        }
        // The final payload is authoritative: when nothing streamed (a
        // silent model, a structured error) it is the only place the
        // answer exists.
        if (finalResponse) {
          if (finalResponse.error) {
            if (!acc) { acc = finalResponse.error.hint || finalResponse.error.code; paint(); }
            setStatus("Réponse incomplète : " + finalResponse.error.code, true);
          } else if (!acc && finalResponse.response) {
            acc = finalResponse.response;
            paint();
          }
          if (Array.isArray(finalResponse.toolsUsed) && finalResponse.toolsUsed.length) {
            setStatus("Outils : " + finalResponse.toolsUsed.join(", "));
          }
        } else if (!acc) {
          acc = streamError ? "Erreur : " + streamError : "Aucune réponse du serveur.";
          paint();
        }
        // A last turn that wrote nothing (tools only, then silence) leaves
        // an empty bubble behind; it says nothing, so it goes.
        if (!acc && bubble.parentNode) bubble.parentNode.removeChild(bubble);
        else addSpeak(bubble);
        state.busy = false;
        refreshSendButton();
        el("input").focus();
        refreshThreads();
        // Shown again from the server: one bubble per stored message, with
        // the edit / regenerate actions on the last ones.
        if (state.current === threadId && state.liveFor === null) openThread(threadId, true);
      });
  }

  // ----- composer -----

  el("composer").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (el("btn-send").classList.contains("stop")) { stopCurrent(); return; }
    // Sending while dictating: stop, transcribe, and send what was said.
    if (rec) { stopRecording(true); return; }
    var input = el("input");
    var text = input.value.trim();
    var images = state.pending.slice();
    var docs = state.docs.slice();
    if ((!text && !images.length && !docs.length) || state.busy || state.preparing) return;
    if (!state.current) newThread();
    input.value = "";
    autoGrow();
    clearPending();
    setStatus("");
    // A photo alone is a question too: "what is this?"; a document alone, "summarise it".
    var question = text || (docs.length && !images.length ? DEFAULT_DOC_QUESTION : DEFAULT_IMAGE_QUESTION);
    var shown = text + docs.map(function (d) { return '<document name="' + d.name.replace(/"/g, "") + '"></document>'; }).join("");
    // Editing the last question: the server forgets it and what followed
    // before the new version is sent (it would otherwise be forgotten too).
    var from = state.editFrom;
    state.editFrom = null;
    if (from && from.parentNode && from.dataset.id) {
      state.busy = true;
      truncateFrom(from)
        .then(function () { dropFrom(from); state.busy = false; send(question, images, shown, docs); })
        .catch(function (err) { state.busy = false; setStatus("Modification impossible : " + err.message, true); });
      return;
    }
    send(question, images, shown, docs);
  });

  // ----- images -----
  //
  // Photos are shrunk in the browser before they leave: a phone photo is
  // several megabytes, the model reads a 1600 px JPEG just as well, and it
  // costs far fewer tokens. Images are sent with the message but not kept:
  // the thread remembers what MaDo said about them, not the pictures.

  var DEFAULT_IMAGE_QUESTION = "Qu'est-ce que c'est ?";
  var DEFAULT_DOC_QUESTION = "Résume ce fichier.";
  // Files are read on the server (PDFs through Mistral OCR when a key is set).
  var MAX_DOCS = 5;
  var MAX_DOC_BYTES = 10 * 1024 * 1024;
  state.docs = [];
  state.caps = {};

  function readDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result)); };
      reader.onerror = function () { reject(new Error("fichier illisible")); };
      reader.readAsDataURL(file);
    });
  }

  function addDocs(list) {
    if (!list.length) return;
    list.forEach(function (file) {
      if (!file.size) { setStatus((file.name || "Fichier") + " est vide.", true); return; }
      if (state.docs.length + state.preparing >= MAX_DOCS) { setStatus("Au plus " + MAX_DOCS + " documents par message.", true); return; }
      if (file.size > MAX_DOC_BYTES) { setStatus(file.name + " : 10 Mo au plus.", true); return; }
      state.preparing++;
      readDataUrl(file)
        .then(function (data) {
          state.docs.push({ name: (file.name || "document").slice(0, 200), data: data });
        })
        .catch(function (err) { setStatus("Document ignoré : " + err.message, true); })
        .then(function () { state.preparing--; renderPending(); });
    });
  }
  var MAX_IMAGES = 10;
  // 1024 px: plenty for a plant, a label or a screen, and vision models bill
  // by the pixel (16 px patches): about 2,700 tokens instead of 6,700 at 1600.
  var MAX_SIDE = 1024;
  state.pending = [];
  state.preparing = 0;

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image illisible")); };
      img.src = url;
    });
  }

  function addFiles(files) {
    // Photos go to the model's eyes; every other file is read as a document.
    var isPhoto = function (f) { return /^image\/(jpeg|png|webp|gif|bmp|avif)$/.test(f.type); };
    addDocs(Array.prototype.filter.call(files || [], function (f) { return !isPhoto(f); }));
    var list = Array.prototype.filter.call(files || [], isPhoto);
    if (!list.length) return;
    var room = MAX_IMAGES - state.pending.length - state.preparing;
    if (list.length > room) setStatus("Au plus " + MAX_IMAGES + " images par message.", true);
    list.slice(0, Math.max(0, room)).forEach(function (file) {
      state.preparing++;
      shrink(file)
        .then(function (dataUrl) { state.pending.push(dataUrl); })
        .catch(function (err) { setStatus("Image ignorée : " + err.message, true); })
        .then(function () { state.preparing--; renderPending(); });
    });
  }

  function renderPending() {
    var box = el("pending");
    box.textContent = "";
    state.pending.forEach(function (src, i) {
      var t = document.createElement("div");
      t.className = "thumb";
      var img = document.createElement("img");
      img.src = src;
      img.alt = "Image jointe";
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "✕";
      x.title = "Retirer";
      x.addEventListener("click", function () { state.pending.splice(i, 1); renderPending(); });
      t.appendChild(img);
      t.appendChild(x);
      box.appendChild(t);
    });
    state.docs.forEach(function (d, i) {
      var chip = document.createElement("div");
      chip.className = "thumb doc";
      var label = document.createElement("span");
      label.textContent = "📄 " + d.name;
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "✕";
      x.title = "Retirer";
      x.addEventListener("click", function () { state.docs.splice(i, 1); renderPending(); });
      chip.appendChild(label);
      chip.appendChild(x);
      box.appendChild(chip);
    });
    box.hidden = state.pending.length === 0 && state.docs.length === 0;
  }

  function clearPending() {
    state.pending = [];
    state.docs = [];
    renderPending();
  }

  el("btn-attach").addEventListener("click", function () { el("file-attach").click(); });
  // ----- camera -----
  //
  // A viewfinder inside the panel. The capture attribute on the file input
  // only hints at the camera, and desktop browsers and some app webviews
  // ignore it and show the same file picker as 📎, so the stream is opened
  // here directly. The panel is same-origin with Home Assistant, which is
  // what lets it reach the camera at all; where it still cannot (permission
  // refused, no camera), the file input stays the fallback.

  var cam = { stream: null, facing: "environment" };

  function stopCamera() {
    if (cam.stream) cam.stream.getTracks().forEach(function (t) { t.stop(); });
    cam.stream = null;
    el("cam-video").srcObject = null;
  }

  function closeCamera() {
    stopCamera();
    el("camera").hidden = true;
  }

  function startCamera() {
    stopCamera();
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: cam.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (stream) {
      cam.stream = stream;
      var video = el("cam-video");
      video.srcObject = stream;
      return video.play().catch(function () {});
    });
  }

  function openCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      el("file-camera").click();
      return;
    }
    if (state.pending.length + state.preparing >= MAX_IMAGES) {
      setStatus("Au plus " + MAX_IMAGES + " images par message.", true);
      return;
    }
    el("camera").hidden = false;
    startCamera().then(function () {
      // A second camera is worth offering only where there is one.
      return navigator.mediaDevices.enumerateDevices().then(function (devices) {
        var count = devices.filter(function (d) { return d.kind === "videoinput"; }).length;
        el("cam-flip").disabled = count < 2;
      });
    }).catch(function () {
      closeCamera();
      setStatus("Caméra indisponible ici : le sélecteur du téléphone va s'ouvrir.", true);
      el("file-camera").click();
    });
  }

  function shoot() {
    var video = el("cam-video");
    if (!cam.stream || !video.videoWidth) return;
    var scale = Math.min(1, MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    state.pending.push(canvas.toDataURL("image/jpeg", 0.85));
    closeCamera();
    if (!state.current) newThread();
    renderPending();
    el("input").focus();
  }

  el("btn-camera").addEventListener("click", openCamera);
  el("cam-shoot").addEventListener("click", shoot);
  el("cam-cancel").addEventListener("click", closeCamera);
  el("cam-flip").addEventListener("click", function () {
    cam.facing = cam.facing === "environment" ? "user" : "environment";
    startCamera().catch(function () { setStatus("Impossible de changer de caméra.", true); });
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !el("camera").hidden) closeCamera();
  });
  // Leaving the page (or the app going to the background) must not leave
  // the camera light on.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && !el("camera").hidden) closeCamera();
  });
  ["file-attach", "file-camera"].forEach(function (id) {
    el(id).addEventListener("change", function (ev) {
      addFiles(ev.target.files);
      ev.target.value = "";
    });
  });

  el("input").addEventListener("paste", function (ev) {
    var items = (ev.clipboardData && ev.clipboardData.files) || [];
    if (items.length) { ev.preventDefault(); addFiles(items); }
  });

  var main = el("main");
  main.addEventListener("dragover", function (ev) {
    if (!ev.dataTransfer || Array.prototype.indexOf.call(ev.dataTransfer.types, "Files") < 0) return;
    ev.preventDefault();
    main.classList.add("drag");
  });
  main.addEventListener("dragleave", function (ev) {
    if (ev.target === main) main.classList.remove("drag");
  });
  main.addEventListener("drop", function (ev) {
    main.classList.remove("drag");
    if (!ev.dataTransfer || !ev.dataTransfer.files.length) return;
    ev.preventDefault();
    if (!state.current) newThread();
    addFiles(ev.dataTransfer.files);
  });

  el("input").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      el("composer").requestSubmit();
    }
  });

  function autoGrow() {
    var input = el("input");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }
  el("input").addEventListener("input", autoGrow);

  el("btn-new").addEventListener("click", newThread);
  // ----- thread list on a phone -----
  //
  // Below 700 px the list slides in over the conversation. The header that
  // holds ☰ sits above both the conversation and the welcome screen, so the
  // list can always be reached, including before any thread is open; the
  // dimmed backdrop and ✕ put it away again.

  var narrow = window.matchMedia("(max-width: 700px)");

  function openSide() {
    el("sidebar").classList.add("open");
    if (narrow.matches) el("backdrop").hidden = false;
  }

  function closeSide() {
    el("sidebar").classList.remove("open");
    el("backdrop").hidden = true;
  }

  el("btn-menu").addEventListener("click", function () {
    if (el("sidebar").classList.contains("open")) closeSide(); else openSide();
  });
  el("btn-close-side").addEventListener("click", closeSide);
  el("backdrop").addEventListener("click", closeSide);
  el("btn-new-top").addEventListener("click", newThread);
  narrow.addEventListener("change", function () { if (!narrow.matches) closeSide(); });
  // On a phone the welcome screen has nothing to do; the list is what the
  // person came for.
  if (narrow.matches && !state.current) openSide();

  // ----- microphone -----
  //
  // Records in the browser, converts to 16 kHz mono WAV (every transcription
  // service reads it, whatever the phone recorded in), and sends it to the
  // server's /api/stt. Where the browser cannot record (no MediaRecorder, or
  // the microphone is refused), the system recorder opens instead through a
  // file input. ⏹ puts the text in the box (after anything already typed),
  // to be read over and sent; the send button while recording stops,
  // transcribes and sends in one go.

  var MAX_RECORD_MS = 120000;
  var rec = null;

  function micLabel(text, recording) {
    var b = el("btn-mic");
    b.textContent = text;
    b.classList.toggle("rec", Boolean(recording));
  }

  function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      el("file-audio").click();
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var chunks = [];
      var recorder = new MediaRecorder(stream);
      var started = Date.now();
      rec = { recorder: recorder, stream: stream, timer: null };
      recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recorder.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        clearInterval(rec.timer);
        var sendAfter = rec.sendAfter;
        rec = null;
        micLabel("🎤", false);
        var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        if (blob.size) transcribe(blob, sendAfter); else setStatus("Rien n'a été enregistré.", true);
      };
      recorder.start();
      micLabel("⏹ 0:00", true);
      rec.timer = setInterval(function () {
        var secs = Math.floor((Date.now() - started) / 1000);
        micLabel("⏹ " + Math.floor(secs / 60) + ":" + ("0" + (secs % 60)).slice(-2), true);
        if (Date.now() - started >= MAX_RECORD_MS) stopRecording();
      }, 250);
      setStatus("J'écoute… ⏹ pour relire le texte, ↑ pour l'envoyer directement.");
    }).catch(function () {
      setStatus("Micro indisponible ici : l'enregistreur du téléphone va s'ouvrir.", true);
      el("file-audio").click();
    });
  }

  function stopRecording(sendAfter) {
    if (!rec || rec.recorder.state === "inactive") return;
    rec.sendAfter = Boolean(sendAfter);
    rec.recorder.stop();
  }

  el("btn-mic").addEventListener("click", function () {
    if (state.busy) return;
    if (rec) stopRecording(); else startRecording();
  });

  el("file-audio").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (file) transcribe(file);
  });

  function toWav(blob) {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx || !window.OfflineAudioContext) return Promise.reject(new Error("no audio context"));
    return blob.arrayBuffer().then(function (buf) {
      var ctx = new Ctx();
      return new Promise(function (resolve, reject) {
        ctx.decodeAudioData(buf, resolve, reject);
      }).then(function (audio) {
        ctx.close();
        var rate = 16000;
        var off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration * rate)), rate);
        var src = off.createBufferSource();
        src.buffer = audio;
        src.connect(off.destination);
        src.start();
        return off.startRendering();
      });
    }).then(function (rendered) {
      var pcm = rendered.getChannelData(0);
      var out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
      function str(o, t) { for (var i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); }
      str(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE");
      str(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
      out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
      str(36, "data"); out.setUint32(40, pcm.length * 2, true);
      for (var i = 0; i < pcm.length; i++) {
        var v = Math.max(-1, Math.min(1, pcm[i]));
        out.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      }
      return new Blob([out.buffer], { type: "audio/wav" });
    });
  }

  function transcribe(blob, sendAfter) {
    var mic = el("btn-mic");
    mic.disabled = true;
    setStatus("Transcription…");
    toWav(blob)
      .catch(function () { return blob; })
      .then(function (audio) {
        var ext = audio.type === "audio/wav" ? "wav" : (audio.type.split("/")[1] || "webm").split(";")[0];
        var form = new FormData();
        form.append("audio", audio, "dictee." + ext);
        form.append("language", (navigator.language || "fr").split("-")[0]);
        return fetch("api/stt", { method: "POST", headers: authHeaders(), body: form });
      })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
          return (data.text || "").trim();
        });
      })
      .then(function (text) {
        if (!text) { setStatus("Je n'ai rien entendu.", true); return; }
        setStatus("");
        var input = el("input");
        input.value = input.value.trim() ? input.value.replace(/\s*$/, " ") + text : text;
        autoGrow();
        if (sendAfter) el("composer").requestSubmit();
        else {
          input.focus();
          var end = input.value.length;
          try { input.setSelectionRange(end, end); } catch (e) { /* not focusable */ }
        }
      })
      .catch(function (err) { setStatus("Transcription impossible : " + err.message, true); })
      .then(function () { mic.disabled = false; });
  }

  // ----- settings -----

  function openSettings() {
    el("token").value = localStorage.getItem(LS_TOKEN) || "";
    el("settings").hidden = false;
    // Inside Home Assistant the server hands out its key, to be copied into
    // the installed app; anywhere else it answers 403 and nothing shows.
    el("app-token").hidden = true;
    fetch("api/app-token", { headers: authHeaders() })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (r) {
        if (!r || !r.token || localStorage.getItem(LS_TOKEN) === r.token) return;
        el("app-token-value").textContent = r.token;
        el("app-token").hidden = false;
      })
      .catch(function () {});
  }
  el("btn-copy-token").addEventListener("click", function () {
    var v = el("app-token-value").textContent;
    var done = function () { el("btn-copy-token").textContent = "Copié ✓"; };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done, function () {});
    else {
      var r = document.createRange();
      r.selectNodeContents(el("app-token-value"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
  });
  el("btn-settings").addEventListener("click", openSettings);
  el("btn-cancel").addEventListener("click", function () { el("settings").hidden = true; });
  el("btn-save").addEventListener("click", function () {
    var v = el("token").value.trim();
    if (v) localStorage.setItem(LS_TOKEN, v); else localStorage.removeItem(LS_TOKEN);
    el("settings").hidden = true;
    refreshThreads();
  });

  // ----- model and thinking pickers -----
  //
  // Per thread, remembered in this browser; a new thread starts from the
  // last choice. "Auto" keeps the add-on settings (main model, fast model for
  // simple commands, thread reasoning).

  var LS_PICK = "mado_pick:";
  function readPick(key) {
    try { return JSON.parse(localStorage.getItem(LS_PICK + key) || "{}") || {}; } catch (e) { return {}; }
  }
  function writePick(key, value) {
    try { localStorage.setItem(LS_PICK + key, JSON.stringify(value)); } catch (e) { /* private mode */ }
  }
  function pickFor(id) {
    var own = id ? readPick(id) : {};
    return own.model !== undefined || own.reasoning !== undefined ? own : readPick("last");
  }
  function showPick() {
    var p = pickFor(state.current);
    var sel = el("pick-model");
    if (p.model && !Array.prototype.some.call(sel.options, function (o) { return o.value === p.model; })) {
      var o = document.createElement("option");
      o.value = p.model;
      o.textContent = p.model;
      sel.appendChild(o);
    }
    sel.value = p.model || "";
    el("pick-reasoning").value = p.reasoning || "";
    fitPicks();
  }
  function savePick() {
    var value = { model: el("pick-model").value, reasoning: el("pick-reasoning").value };
    writePick("last", value);
    if (state.current) writePick(state.current, value);
  }
  // A pill is as wide as the choice it shows, not as its longest option.
  var measure = document.createElement("canvas").getContext("2d");
  function fitSelect(sel) {
    var opt = sel.options[sel.selectedIndex];
    if (!opt) return;
    measure.font = "12px " + getComputedStyle(sel).fontFamily;
    sel.style.width = Math.ceil(measure.measureText(opt.textContent).width + 34) + "px";
  }
  function fitPicks() { fitSelect(el("pick-model")); fitSelect(el("pick-reasoning")); }
  el("pick-model").addEventListener("change", function () { savePick(); fitPicks(); });
  el("pick-reasoning").addEventListener("change", function () { savePick(); fitPicks(); });

  function loadModels() {
    return api("api/models").then(function (res) { return res.json(); }).then(function (data) {
      var sel = el("pick-model");
      sel.textContent = "";
      var auto = document.createElement("option");
      auto.value = "";
      auto.textContent = "Auto";
      el("pick-model").parentNode.title = "Modèle utilisé dans ce fil. Auto : " + (data.main || "le modèle principal") +
        (data.fast ? ", et " + data.fast + " pour les ordres simples" : "");
      sel.appendChild(auto);
      (data.models || []).forEach(function (m) {
        var o = document.createElement("option");
        o.value = m.id;
