<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaDo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #111318; color: #e6e9ef; }
  #app { display: flex; height: 100vh; height: 100dvh; }
  #sidebar { width: 280px; min-width: 280px; background: #1a1d24; display: flex; flex-direction: column; border-right: 1px solid #262a33; }
  .side-head { padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 600; font-size: 16px; letter-spacing: 0.5px; }
  #btn-new { background: rgba(59,91,219,0.15); color: #9fb4ff; border: 1px solid rgba(59,91,219,0.4); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #btn-new:hover { background: rgba(59,91,219,0.3); }
  #threads { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .thread { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .thread:hover { background: #232733; }
  .thread.active { background: #2a2f3d; }
  .thread .t-main { flex: 1; min-width: 0; }
  .thread .t-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread .t-date { font-size: 11px; color: #8b93a5; }
  .thread .t-del { visibility: hidden; border: 0; background: none; color: #8b93a5; cursor: pointer; font-size: 13px; padding: 2px; }
  .thread:hover .t-del { visibility: visible; }
  @media (hover: none) { .thread .t-del, .thread .t-edit { visibility: visible; } }
  .thread .t-del:hover { color: #ff6b6b; }
  .side-foot { padding: 12px 14px; border-top: 1px solid #262a33; display: flex; align-items: center; justify-content: space-between; }
  .muted { color: #8b93a5; font-size: 12px; background: none; border: 0; font-family: inherit; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; height: 100dvh; }
  #empty:not([hidden]) { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #8b93a5; }
  #empty .big { font-size: 22px; color: #e6e9ef; }
  #chat:not([hidden]) { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #chat-head { padding: 14px 18px; border-bottom: 1px solid #262a33; display: flex; align-items: center; gap: 10px; }
  #chat-title { font-weight: 600; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #3b5bdb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #232733; border-bottom-left-radius: 4px; }
  .msg.assistant:has(.code) { width: 78%; }
  .code { margin: 8px 0; border: 1px solid #2c313d; border-radius: 10px; overflow: hidden; background: #0d0f14; white-space: normal; }
  .code-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 12px; background: #1a1d24; border-bottom: 1px solid #2c313d; font-size: 12px; color: #8b93a5; }
  .code-copy { background: none; border: 1px solid #2c313d; color: #c9d1e0; border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .code-copy:hover { background: #232733; }
  .code-copy.done { color: #69db7c; border-color: #2f5e3a; }
  .code pre { margin: 0; padding: 10px 12px; overflow-x: auto; }
  .code code, .inline-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .code code { white-space: pre; color: #e6e9ef; }
  .inline-code { background: #1a1d24; border: 1px solid #2c313d; border-radius: 5px; padding: 0 4px; }
  #statusline { padding: 4px 18px; font-size: 12px; color: #8b93a5; }
  #statusline.err { color: #ff6b6b; }
  #composer { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid #262a33; }
  #input { flex: 1; resize: none; background: #1a1d24; color: #e6e9ef; border: 1px solid #2c313d; border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 14px; max-height: 160px; }
  #input:focus { outline: 1px solid #3b5bdb; }
  #btn-send { background: #3b5bdb; color: #fff; border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer; font-size: 14px; }
  #btn-send:disabled { opacity: 0.5; cursor: default; }
  .icon-btn { background: #1a1d24; color: #c9d1e0; border: 1px solid #2c313d; border-radius: 12px; width: 42px; min-width: 42px; cursor: pointer; font-size: 17px; }
  .icon-btn:hover { background: #232733; }
  .icon-btn.rec { background: #c92a2a; border-color: #c92a2a; color: #fff; width: auto; padding: 0 10px; font-size: 13px; white-space: nowrap; }
  .icon-btn:disabled { opacity: 0.5; cursor: default; }
  #pending:not([hidden]) { display: flex; gap: 8px; padding: 10px 18px 0; flex-wrap: wrap; }
  .thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid #2c313d; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.65); color: #fff; font-size: 11px; cursor: pointer; line-height: 20px; padding: 0; }
  .msg-images { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .msg-images img { max-width: 220px; max-height: 220px; border-radius: 10px; display: block; cursor: zoom-in; }
  .msg-images:last-child { margin-bottom: 0; }
  #camera:not([hidden]) { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  #camera video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  #camera .cam-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px calc(16px + env(safe-area-inset-bottom)); background: #000; }
  #camera .cam-side { background: none; border: 0; color: #fff; font: inherit; font-size: 15px; cursor: pointer; min-width: 72px; padding: 8px; }
  #camera .cam-side:disabled { opacity: 0.3; cursor: default; }
  #cam-shoot { width: 68px; height: 68px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,0.25); cursor: pointer; padding: 0; }
  #cam-shoot:active { background: rgba(255,255,255,0.6); }
  #main.drag { outline: 2px dashed #3b5bdb; outline-offset: -8px; }
  .thread .t-edit { visibility: hidden; border: 0; background: none; color: #8b93a5; cursor: pointer; font-size: 13px; padding: 2px; }
  .thread:hover .t-edit { visibility: visible; }
  .thread .t-edit:hover { color: #9fb4ff; }
  .rename { width: 100%; background: #111318; color: #e6e9ef; border: 1px solid #3b5bdb; border-radius: 6px; padding: 2px 6px; font: inherit; font-size: 13px; }
  #chat-title { cursor: text; }
  #chat-title.untitled { cursor: default; }
  #btn-menu, #btn-new-top, #btn-close-side { display: none; background: none; border: 0; color: #e6e9ef; cursor: pointer; }
  #btn-menu { font-size: 22px; padding: 4px 10px 4px 0; line-height: 1; }
  #btn-new-top { margin-left: auto; font-size: 22px; padding: 4px 0 4px 10px; line-height: 1; color: #9fb4ff; }
  #btn-close-side { font-size: 16px; padding: 4px 6px; color: #8b93a5; }
  #backdrop:not([hidden]) { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,0.5); }
  #chat-title { flex: 1; min-width: 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); }
  .modal:not([hidden]) { display: flex; align-items: center; justify-content: center; }
  .modal .box { background: #1a1d24; border: 1px solid #2c313d; border-radius: 12px; padding: 20px; width: min(420px, 90vw); }
  .modal h2 { font-size: 15px; margin-bottom: 8px; }
  .modal p { margin-bottom: 10px; }
  .modal input { width: 100%; background: #111318; color: #e6e9ef; border: 1px solid #2c313d; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .modal .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal button { border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font: inherit; }
  .modal .save { background: #3b5bdb; color: #fff; }
  .modal .cancel { background: #232733; color: #e6e9ef; }
  @media (max-width: 700px) {
    #sidebar { position: fixed; top: 0; bottom: 0; z-index: 10; left: -290px; width: 280px; transition: left 0.2s; box-shadow: 4px 0 16px rgba(0,0,0,0.4); }
    #sidebar.open { left: 0; }
    #btn-menu, #btn-new-top, #btn-close-side { display: block; }
    #btn-new { margin-left: auto; }
    #chat-head { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <span class="brand">MaDo</span>
      <button id="btn-new" type="button">+ Nouveau fil</button>
      <button id="btn-close-side" type="button" title="Fermer" aria-label="Fermer la liste">✕</button>
    </div>
    <nav id="threads"></nav>
    <div class="side-foot">
      <button id="btn-settings" type="button" class="muted">Clé API</button>
      <span id="health" class="muted"></span>
    </div>
  </aside>
  <div id="backdrop" hidden></div>
  <main id="main">
    <header id="chat-head">
      <button id="btn-menu" type="button" title="Fils de discussion" aria-label="Afficher les fils de discussion">☰</button>
      <span id="chat-title" class="untitled">MaDo</span>
      <button id="btn-new-top" type="button" title="Nouveau fil" aria-label="Nouveau fil">＋</button>
    </header>
    <div id="empty">
      <div class="big">MaDo</div>
      <div>Créez un fil ou choisissez-en un dans la liste.</div>
    </div>
    <div id="chat" hidden>
      <div id="messages"></div>
      <div id="statusline" hidden></div>
      <div id="pending" hidden></div>
      <form id="composer">
        <button id="btn-attach" class="icon-btn" type="button" title="Joindre une image">📎</button>
        <button id="btn-camera" class="icon-btn" type="button" title="Prendre une photo">📷</button>
        <input id="file-attach" type="file" accept="image/*" multiple hidden>
        <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
        <input id="file-audio" type="file" accept="audio/*" capture hidden>
        <textarea id="input" rows="1" placeholder="Écrivez à MaDo…"></textarea>
        <button id="btn-mic" class="icon-btn" type="button" title="Parler" hidden>🎤</button>
        <button id="btn-send" type="submit">Envoyer</button>
      </form>
    </div>
  </main>
</div>
<div id="camera" hidden>
  <video id="cam-video" autoplay playsinline muted></video>
  <div class="cam-bar">
    <button id="cam-cancel" class="cam-side" type="button">Annuler</button>
    <button id="cam-shoot" type="button" title="Prendre la photo" aria-label="Prendre la photo"></button>
    <button id="cam-flip" class="cam-side" type="button" title="Changer de caméra">⟲</button>
  </div>
</div>
<div id="settings" class="modal" hidden>
  <div class="box">
    <h2>Clé API</h2>
    <p class="muted">Seulement si un token API protège le serveur. Sous Home Assistant, le panneau est déjà protégé par la connexion HA.</p>
    <input id="token" type="password" autocomplete="off">
    <div class="row">
      <button type="button" class="cancel" id="btn-cancel">Annuler</button>
      <button type="button" class="save" id="btn-save">Enregistrer</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  // The panel talks to the same server that serves this page, under one
  // user id for every thread. Each "mado-thread:" id is a sealed world on
  // the server: its own history, its own long-term memory and its own
  // recall, with nothing from Assist or the other threads, and nothing
  // learned here reaching them (memory/memory-scope.ts).
  var USER_ID = "default";
  var THREAD_PREFIX = "mado-thread:";
  var LS_TOKEN = "mado_api_token";

  var el = function (id) { return document.getElementById(id); };
  var state = { current: null, threads: [], busy: false };

  function authHeaders() {
    var h = {};
    var token = localStorage.getItem(LS_TOKEN);
    if (token) h["Authorization"] = "Bearer " + token;
    return h;
  }

  function headers() {
    return Object.assign({ "Content-Type": "application/json" }, authHeaders());
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign(headers(), opts.headers || {});
    return fetch(path, opts).then(function (res) {
      if (res.ok) return res;
      var status = res.status;
      return res.text().then(function (text) {
        var err = new Error("HTTP " + status + " " + (text || "").slice(0, 200));
        err.status = status;
        throw err;
      });
    });
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  // ----- sidebar -----

  function loadThreads() {
    return api("api/conversations/" + USER_ID)
      .then(function (res) { return res.json(); })
      .then(function (list) {
        return (Array.isArray(list) ? list : []).filter(function (c) {
          return typeof c.conversationId === "string" && c.conversationId.indexOf(THREAD_PREFIX) === 0;
        });
      });
  }

  function renderThreads(threads) {
    var nav = el("threads");
    nav.textContent = "";
    threads.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "thread" + (t.conversationId === state.current ? " active" : "");
      var main = document.createElement("div");
      main.className = "t-main";
      var title = document.createElement("div");
      title.className = "t-title";
      title.textContent = t.title || "Sans titre";
      var date = document.createElement("div");
      date.className = "t-date";
      try { date.textContent = new Date(t.lastMessageAt).toLocaleString(); } catch (e) { date.textContent = ""; }
      main.appendChild(title);
      main.appendChild(date);
      var edit = document.createElement("button");
      edit.className = "t-edit"; edit.type = "button"; edit.textContent = "✎";
      edit.title = "Renommer ce fil";
      edit.addEventListener("click", function (ev) {
        ev.stopPropagation();
        startRename(t.conversationId, title);
      });
      var del = document.createElement("button");
      del.className = "t-del"; del.type = "button"; del.textContent = "✕";
      del.title = "Supprimer ce fil";
      del.addEventListener("click", function (ev) {
        ev.stopPropagation();
        deleteThread(t.conversationId);
      });
      row.appendChild(main);
      row.appendChild(edit);
      row.appendChild(del);
      row.addEventListener("click", function () { openThread(t.conversationId); });
      nav.appendChild(row);
    });
    if (!threads.length) {
      var hint = document.createElement("div");
      hint.className = "muted";
      hint.style.padding = "10px";
      hint.textContent = "Aucun fil pour le moment.";
      nav.appendChild(hint);
    }
  }

  function refreshThreads() {
    return loadThreads()
      .then(function (list) { state.threads = list; renderThreads(list); })
      .catch(showListError);
  }

  function showListError(err) {
    var nav = el("threads");
    nav.textContent = "";
    var hint = document.createElement("div");
    hint.className = "muted";
    hint.style.padding = "10px";
    hint.style.color = "#ff6b6b";
    hint.textContent = "Liste indisponible : " + err.message;
    nav.appendChild(hint);
    if (err.status === 401 || err.status === 403) openSettings();
  }

  // Inline rename: the title turns into a field; Enter or leaving it saves,
  // Escape cancels. A thread can only be named once it has a message, since
  // the server keeps names for conversations it knows.
  function startRename(id, titleEl) {
    if (titleEl.querySelector("input")) return;
    var known = state.threads.filter(function (t) { return t.conversationId === id; })[0];
    if (!known) return;
    var before = known.title || "";
    var field = document.createElement("input");
    field.className = "rename";
    field.maxLength = 120;
    field.value = before;
    titleEl.textContent = "";
    titleEl.appendChild(field);
    field.addEventListener("click", function (ev) { ev.stopPropagation(); });
    field.focus();
    field.select();
    var done = false;
    function finish(save) {
      if (done) return;
      done = true;
      var value = field.value.replace(/\s+/g, " ").trim();
      if (!save || !value || value === before) {
        titleEl.textContent = before || "Sans titre";
        return;
      }
      titleEl.textContent = value;
      api("api/conversations/" + USER_ID + "/" + encodeURIComponent(id), {
        method: "PATCH",
        body: JSON.stringify({ title: value })
      })
        .then(function () {
          known.title = value;
          if (state.current === id) el("chat-title").textContent = value;
          return refreshThreads();
        })
        .catch(function (err) {
          titleEl.textContent = before || "Sans titre";
          setStatus("Renommage impossible : " + err.message, true);
        });
    }
    field.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
      else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
    });
    field.addEventListener("blur", function () { finish(true); });
  }

  el("chat-title").addEventListener("click", function () {
    var known = state.threads.filter(function (t) { return t.conversationId === state.current; })[0];
    if (known) startRename(state.current, el("chat-title"));
  });

  function deleteThread(id) {
    if (!window.confirm("Supprimer ce fil ? Ses messages et tout ce qu'il a mémorisé seront perdus.")) return;
    api("api/conversations/" + USER_ID + "/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function () {
        if (state.current === id) newThread();
        return refreshThreads();
      })
      .catch(function (err) { setStatus(err.message, true); });
  }

  // ----- chat -----

  function openThread(id) {
    state.current = id;
    el("chat").hidden = false;
    el("empty").hidden = true;
    var known = state.threads.filter(function (t) { return t.conversationId === id; })[0];
    el("chat-title").textContent = (known && known.title) || "Fil";
    el("chat-title").classList.remove("untitled");
    el("messages").textContent = "";
    setStatus("");
    closeSide();
    api("api/conversations/" + USER_ID + "/" + encodeURIComponent(id))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var messages = (data && data.messages) || [];
        messages.forEach(function (m) { addBubble(m.role, m.content); });
        scrollDown();
      })
      .catch(function (err) { addBubble("assistant", "Historique indisponible : " + err.message); });
  }

  function newThread() {
    state.current = THREAD_PREFIX + uuid();
    el("chat").hidden = false;
    el("empty").hidden = true;
    el("chat-title").textContent = "Nouveau fil";
    el("chat-title").classList.add("untitled");
    el("messages").textContent = "";
    setStatus("");
    closeSide();
    el("input").focus();
  }

  function addBubble(role, text, images) {
    var box = document.createElement("div");
    box.className = "msg " + (role === "user" ? "user" : "assistant");
    renderInto(box, role, text);
    if (images && images.length) {
      var strip = document.createElement("div");
      strip.className = "msg-images";
      images.forEach(function (src) {
        var img = document.createElement("img");
        img.src = src;
        img.alt = "Image envoyée";
        img.addEventListener("click", function () { window.open(src, "_blank"); });
        strip.appendChild(img);
      });
      box.insertBefore(strip, box.firstChild);
    }
    el("messages").appendChild(box);
    return box;
  }

  // ----- message rendering -----
  //
  // Assistant replies get their ``` fenced code shown as a block with a copy
  // button, and `inline code` in a monospace span. Everything is built with
  // DOM nodes and textContent, never innerHTML, so a reply can never inject
  // markup. A fence still open at the end (mid-stream) renders as code too.

  var FENCE = /```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g;

  function renderInto(box, role, text) {
    box.textContent = "";
    if (role === "user") { box.textContent = text; return; }
    var last = 0;
    var match;
    FENCE.lastIndex = 0;
    while ((match = FENCE.exec(text)) !== null) {
      if (match[0] === "") { FENCE.lastIndex++; continue; }
      // The newlines around a fence are layout, not text: under pre-wrap they
      // would show as blank lines above and below the block.
      appendText(box, text.slice(last, match.index).replace(/\n$/, ""));
      box.appendChild(codeBlock(match[1].trim(), match[2].replace(/\n$/, "")));
      last = match.index + match[0].length;
      if (text.charAt(last) === "\n") last++;
    }
    appendText(box, text.slice(last));
  }

  function appendText(box, text) {
    if (!text) return;
    var parts = text.split(/`([^`\n]+)`/);
    parts.forEach(function (part, i) {
      if (!part) return;
      if (i % 2 === 1) {
        var span = document.createElement("code");
        span.className = "inline-code";
        span.textContent = part;
        box.appendChild(span);
      } else {
        box.appendChild(document.createTextNode(part));
      }
    });
  }

  function codeBlock(lang, code) {
    var wrap = document.createElement("div");
    wrap.className = "code";
    var head = document.createElement("div");
    head.className = "code-head";
    var label = document.createElement("span");
    label.textContent = lang || "code";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "code-copy";
    btn.textContent = "Copier";
    btn.addEventListener("click", function () {
      copyText(code).then(function () {
        btn.textContent = "Copié ✓";
        btn.classList.add("done");
      }, function () {
        btn.textContent = "Échec";
      }).then(function () {
        setTimeout(function () { btn.textContent = "Copier"; btn.classList.remove("done"); }, 1500);
      });
    });
    head.appendChild(label);
    head.appendChild(btn);
    var pre = document.createElement("pre");
    var codeEl = document.createElement("code");
    codeEl.textContent = code;
    pre.appendChild(codeEl);
    wrap.appendChild(head);
    wrap.appendChild(pre);
    return wrap;
  }

  // The panel runs in Home Assistant's ingress iframe, where the async
  // clipboard API can be refused; the textarea + execCommand path still works.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(area);
      if (ok) resolve(); else reject(new Error("copy failed"));
    });
  }

  function scrollDown() {
    var m = el("messages");
    m.scrollTop = m.scrollHeight;
  }

  function setStatus(text, isError) {
    var s = el("statusline");
    if (!text) { s.hidden = true; s.textContent = ""; s.className = ""; return; }
    s.hidden = false;
    s.textContent = text;
    s.className = isError ? "err" : "";
  }

  function send(text, images, shown) {
    state.busy = true;
    el("btn-send").disabled = true;
    addBubble("user", shown, images);
    scrollDown();
    var bubble = addBubble("assistant", "");
    var acc = "";
    var finalResponse = null;

    function paint() { renderInto(bubble, "assistant", acc); scrollDown(); }

    function handleBlock(block) {
      var lines = block.split("\n");
      var eventName = "message";
      var data = "";
      lines.forEach(function (line) {
        if (line.indexOf("event: ") === 0) eventName = line.slice(7).trim();
        else if (line.indexOf("data: ") === 0) data += line.slice(6);
      });
      if (!data) return;
      var payload = null;
      try { payload = JSON.parse(data); } catch (e) { return; }
      if (eventName === "chunk") { acc += payload.text || ""; paint(); }
      // The server opens every model turn with "turn", the first one too, and
      // a turn that only calls tools writes nothing. A new bubble is only
      // worth opening once the current one holds text.
      else if (eventName === "turn") { if (acc) { bubble = addBubble("assistant", ""); acc = ""; } }
      else if (eventName === "status") { setStatus(payload.text || ""); }
      else if (eventName === "error") { streamError = payload.error || "Erreur"; setStatus(streamError, true); }
      else if (eventName === "done") { finalResponse = payload; }
    }

    var payload = {
      message: text,
      userId: USER_ID,
      conversationId: state.current,
      isVoice: false,
      language: navigator.language
    };
    if (images && images.length) payload.images = images;
    var body = JSON.stringify(payload);
    var streamError = "";

    fetch("api/chat/stream", { method: "POST", headers: headers(), body: body })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buf = "";
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) return;
            buf += decoder.decode(r.value, { stream: true });
            var blocks = buf.split("\n\n");
            buf = blocks.pop();
            blocks.forEach(handleBlock);
            return pump();
          });
        }
        return pump();
      })
      .catch(function (err) { streamError = String(err.message || err); setStatus(streamError, true); })
      .then(function () {
        // The final payload is authoritative: when nothing streamed (a
        // silent model, a structured error) it is the only place the
        // answer exists.
        if (finalResponse) {
          if (finalResponse.error) {
            if (!acc) { acc = finalResponse.error.hint || finalResponse.error.code; paint(); }
            setStatus("Réponse incomplète : " + finalResponse.error.code, true);
          } else if (!acc && finalResponse.response) {
            acc = finalResponse.response;
            paint();
          }
          if (Array.isArray(finalResponse.toolsUsed) && finalResponse.toolsUsed.length) {
            setStatus("Outils : " + finalResponse.toolsUsed.join(", "));
          }
        } else if (!acc) {
          acc = streamError ? "Erreur : " + streamError : "Aucune réponse du serveur.";
          paint();
        }
        // A last turn that wrote nothing (tools only, then silence) leaves
        // an empty bubble behind; it says nothing, so it goes.
        if (!acc && bubble.parentNode) bubble.parentNode.removeChild(bubble);
        state.busy = false;
        el("btn-send").disabled = false;
        el("input").focus();
        refreshThreads();
      });
  }

  // ----- composer -----

  el("composer").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = el("input");
    var text = input.value.trim();
    var images = state.pending.slice();
    if ((!text && !images.length) || state.busy || state.preparing) return;
    if (!state.current) newThread();
    input.value = "";
    autoGrow();
    clearPending();
    setStatus("");
    // A photo alone is a question too: "what is this?"
    send(text || DEFAULT_IMAGE_QUESTION, images, text);
  });

  // ----- images -----
  //
  // Photos are shrunk in the browser before they leave: a phone photo is
  // several megabytes, the model reads a 1600 px JPEG just as well, and it
  // costs far fewer tokens. Images are sent with the message but not kept:
  // the thread remembers what MaDo said about them, not the pictures.

  var DEFAULT_IMAGE_QUESTION = "Qu'est-ce que c'est ?";
  var MAX_IMAGES = 10;
  // 1024 px: plenty for a plant, a label or a screen, and vision models bill
  // by the pixel (16 px patches): about 2,700 tokens instead of 6,700 at 1600.
  var MAX_SIDE = 1024;
  state.pending = [];
  state.preparing = 0;

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image illisible")); };
      img.src = url;
    });
  }

  function addFiles(files) {
    var list = Array.prototype.filter.call(files || [], function (f) { return /^image\//.test(f.type); });
    if (!list.length) return;
    var room = MAX_IMAGES - state.pending.length - state.preparing;
    if (list.length > room) setStatus("Au plus " + MAX_IMAGES + " images par message.", true);
    list.slice(0, Math.max(0, room)).forEach(function (file) {
      state.preparing++;
      shrink(file)
        .then(function (dataUrl) { state.pending.push(dataUrl); })
        .catch(function (err) { setStatus("Image ignorée : " + err.message, true); })
        .then(function () { state.preparing--; renderPending(); });
    });
  }

  function renderPending() {
    var box = el("pending");
    box.textContent = "";
    state.pending.forEach(function (src, i) {
      var t = document.createElement("div");
      t.className = "thumb";
      var img = document.createElement("img");
      img.src = src;
      img.alt = "Image jointe";
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "✕";
      x.title = "Retirer";
      x.addEventListener("click", function () { state.pending.splice(i, 1); renderPending(); });
      t.appendChild(img);
      t.appendChild(x);
      box.appendChild(t);
    });
    box.hidden = state.pending.length === 0;
  }

  function clearPending() {
    state.pending = [];
    renderPending();
  }

  el("btn-attach").addEventListener("click", function () { el("file-attach").click(); });
  // ----- camera -----
  //
  // A viewfinder inside the panel. The capture attribute on the file input
  // only hints at the camera, and desktop browsers and some app webviews
  // ignore it and show the same file picker as 📎, so the stream is opened
  // here directly. The panel is same-origin with Home Assistant, which is
  // what lets it reach the camera at all; where it still cannot (permission
  // refused, no camera), the file input stays the fallback.

  var cam = { stream: null, facing: "environment" };

  function stopCamera() {
    if (cam.stream) cam.stream.getTracks().forEach(function (t) { t.stop(); });
    cam.stream = null;
    el("cam-video").srcObject = null;
  }

  function closeCamera() {
    stopCamera();
    el("camera").hidden = true;
  }

  function startCamera() {
    stopCamera();
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: cam.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (stream) {
      cam.stream = stream;
      var video = el("cam-video");
      video.srcObject = stream;
      return video.play().catch(function () {});
    });
  }

  function openCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      el("file-camera").click();
      return;
    }
    if (state.pending.length + state.preparing >= MAX_IMAGES) {
      setStatus("Au plus " + MAX_IMAGES + " images par message.", true);
      return;
    }
    el("camera").hidden = false;
    startCamera().then(function () {
      // A second camera is worth offering only where there is one.
      return navigator.mediaDevices.enumerateDevices().then(function (devices) {
        var count = devices.filter(function (d) { return d.kind === "videoinput"; }).length;
        el("cam-flip").disabled = count < 2;
      });
    }).catch(function () {
      closeCamera();
      setStatus("Caméra indisponible ici : le sélecteur du téléphone va s'ouvrir.", true);
      el("file-camera").click();
    });
  }

  function shoot() {
    var video = el("cam-video");
    if (!cam.stream || !video.videoWidth) return;
    var scale = Math.min(1, MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    state.pending.push(canvas.toDataURL("image/jpeg", 0.85));
    closeCamera();
    if (!state.current) newThread();
    renderPending();
    el("input").focus();
  }

  el("btn-camera").addEventListener("click", openCamera);
  el("cam-shoot").addEventListener("click", shoot);
  el("cam-cancel").addEventListener("click", closeCamera);
  el("cam-flip").addEventListener("click", function () {
    cam.facing = cam.facing === "environment" ? "user" : "environment";
    startCamera().catch(function () { setStatus("Impossible de changer de caméra.", true); });
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !el("camera").hidden) closeCamera();
  });
  // Leaving the page (or the app going to the background) must not leave
  // the camera light on.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && !el("camera").hidden) closeCamera();
  });
  ["file-attach", "file-camera"].forEach(function (id) {
    el(id).addEventListener("change", function (ev) {
      addFiles(ev.target.files);
      ev.target.value = "";
    });
  });

  el("input").addEventListener("paste", function (ev) {
    var items = (ev.clipboardData && ev.clipboardData.files) || [];
    if (items.length) { ev.preventDefault(); addFiles(items); }
  });

  var main = el("main");
  main.addEventListener("dragover", function (ev) {
    if (!ev.dataTransfer || Array.prototype.indexOf.call(ev.dataTransfer.types, "Files") < 0) return;
    ev.preventDefault();
    main.classList.add("drag");
  });
  main.addEventListener("dragleave", function (ev) {
    if (ev.target === main) main.classList.remove("drag");
  });
  main.addEventListener("drop", function (ev) {
    main.classList.remove("drag");
    if (!ev.dataTransfer || !ev.dataTransfer.files.length) return;
    ev.preventDefault();
    if (!state.current) newThread();
    addFiles(ev.dataTransfer.files);
  });

  el("input").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      el("composer").requestSubmit();
    }
  });

  function autoGrow() {
    var input = el("input");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  el("input").addEventListener("input", autoGrow);

  el("btn-new").addEventListener("click", newThread);
  // ----- thread list on a phone -----
  //
  // Below 700 px the list slides in over the conversation. The header that
  // holds ☰ sits above both the conversation and the welcome screen, so the
  // list can always be reached, including before any thread is open; the
  // dimmed backdrop and ✕ put it away again.

  var narrow = window.matchMedia("(max-width: 700px)");

  function openSide() {
    el("sidebar").classList.add("open");
    if (narrow.matches) el("backdrop").hidden = false;
  }

  function closeSide() {
    el("sidebar").classList.remove("open");
    el("backdrop").hidden = true;
  }

  el("btn-menu").addEventListener("click", function () {
    if (el("sidebar").classList.contains("open")) closeSide(); else openSide();
  });
  el("btn-close-side").addEventListener("click", closeSide);
  el("backdrop").addEventListener("click", closeSide);
  el("btn-new-top").addEventListener("click", newThread);
  narrow.addEventListener("change", function () { if (!narrow.matches) closeSide(); });
  // On a phone the welcome screen has nothing to do; the list is what the
  // person came for.
  if (narrow.matches && !state.current) openSide();

  // ----- microphone -----
  //
  // Records in the browser, converts to 16 kHz mono WAV (every transcription
  // service reads it, whatever the phone recorded in), and sends it to the
  // server's /api/stt. Where the browser cannot record (no MediaRecorder, or
  // the microphone is refused), the system recorder opens instead through a
  // file input. The text goes into the box and is sent at once, unless
  // something was already typed there, in which case it is only added.

  var MAX_RECORD_MS = 120000;
  var rec = null;

  function micLabel(text, recording) {
    var b = el("btn-mic");
    b.textContent = text;
    b.classList.toggle("rec", Boolean(recording));
  }

  function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      el("file-audio").click();
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var chunks = [];
      var recorder = new MediaRecorder(stream);
      var started = Date.now();
      rec = { recorder: recorder, stream: stream, timer: null };
      recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recorder.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        clearInterval(rec.timer);
        rec = null;
        micLabel("🎤", false);
        var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        if (blob.size) transcribe(blob); else setStatus("Rien n'a été enregistré.", true);
      };
      recorder.start();
      micLabel("⏹ 0:00", true);
      rec.timer = setInterval(function () {
        var secs = Math.floor((Date.now() - started) / 1000);
        micLabel("⏹ " + Math.floor(secs / 60) + ":" + ("0" + (secs % 60)).slice(-2), true);
        if (Date.now() - started >= MAX_RECORD_MS) stopRecording();
      }, 250);
      setStatus("J'écoute… touchez ⏹ pour terminer.");
    }).catch(function () {
      setStatus("Micro indisponible ici : l'enregistreur du téléphone va s'ouvrir.", true);
      el("file-audio").click();
    });
  }

  function stopRecording() {
    if (rec && rec.recorder.state !== "inactive") rec.recorder.stop();
  }

  el("btn-mic").addEventListener("click", function () {
    if (state.busy) return;
    if (rec) stopRecording(); else startRecording();
  });

  el("file-audio").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (file) transcribe(file);
  });

  function toWav(blob) {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx || !window.OfflineAudioContext) return Promise.reject(new Error("no audio context"));
    return blob.arrayBuffer().then(function (buf) {
      var ctx = new Ctx();
      return new Promise(function (resolve, reject) {
        ctx.decodeAudioData(buf, resolve, reject);
      }).then(function (audio) {
        ctx.close();
        var rate = 16000;
        var off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration * rate)), rate);
        var src = off.createBufferSource();
        src.buffer = audio;
        src.connect(off.destination);
        src.start();
        return off.startRendering();
      });
    }).then(function (rendered) {
      var pcm = rendered.getChannelData(0);
      var out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
      function str(o, t) { for (var i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); }
      str(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE");
      str(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
      out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
      str(36, "data"); out.setUint32(40, pcm.length * 2, true);
      for (var i = 0; i < pcm.length; i++) {
        var v = Math.max(-1, Math.min(1, pcm[i]));
        out.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      }
      return new Blob([out.buffer], { type: "audio/wav" });
    });
  }

  function transcribe(blob) {
    var mic = el("btn-mic");
    mic.disabled = true;
    setStatus("Transcription…");
    toWav(blob)
      .catch(function () { return blob; })
      .then(function (audio) {
        var ext = audio.type === "audio/wav" ? "wav" : (audio.type.split("/")[1] || "webm").split(";")[0];
        var form = new FormData();
        form.append("audio", audio, "dictee." + ext);
        form.append("language", (navigator.language || "fr").split("-")[0]);
        return fetch("api/stt", { method: "POST", headers: authHeaders(), body: form });
      })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
          return (data.text || "").trim();
        });
      })
      .then(function (text) {
        if (!text) { setStatus("Je n'ai rien entendu.", true); return; }
        setStatus("");
        var input = el("input");
        if (input.value.trim()) {
          input.value = input.value.replace(/\s*$/, " ") + text;
          autoGrow();
          input.focus();
        } else {
          input.value = text;
          el("composer").requestSubmit();
        }
      })
      .catch(function (err) { setStatus("Transcription impossible : " + err.message, true); })
      .then(function () { mic.disabled = false; });
  }

  // ----- settings -----

  function openSettings() {
    el("token").value = localStorage.getItem(LS_TOKEN) || "";
    el("settings").hidden = false;
  }
  el("btn-settings").addEventListener("click", openSettings);
  el("btn-cancel").addEventListener("click", function () { el("settings").hidden = true; });
  el("btn-save").addEventListener("click", function () {
    var v = el("token").value.trim();
    if (v) localStorage.setItem(LS_TOKEN, v); else localStorage.removeItem(LS_TOKEN);
    el("settings").hidden = true;
    refreshThreads();
  });

  // ----- boot -----

  api("api/health")
    .then(function (res) { return res.json(); })
    .then(function (h) {
      el("health").textContent = "v" + (h.version || "?");
      // The microphone needs the server's transcription; without it the
      // button would only ever answer with an error.
      el("btn-mic").hidden = !h.stt;
    })
    .catch(function () {});
  refreshThreads();
})();
</script>
</body>
</html>
